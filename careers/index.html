<script type="text/babel">
const { useState, useEffect, useRef } = React;

const UTM_KEYS = ['utm_source','utm_medium','utm_campaign','utm_content','utm_term'];
const APPLIED_KEY = 'respawn_careers_applied';
const LIST_TITLE = 'Careers & Freelance Opportunities | Respawn Media Chennai';
const WHATSAPP_GROUP_URL = 'https://chat.whatsapp.com/LHZCScn664h3zTtTVUtaLv';

function careersSearch() {
  return window.location.search || '';
}
function careersHref(path) {
  return path + careersSearch();
}
function parseCareersRoute() {
  const path = (window.location.pathname || '').replace(/\/+$/, '') || '/';
  if (path === '/careers/thanks') return { page: 'thanks' };
  const m = path.match(/^\/careers\/apply\/([^/]+)$/);
  if (m) return { page: 'apply', slug: decodeURIComponent(m[1]) };
  return { page: 'list' };
}
function applyHref(role) {
  return careersHref('/careers/apply/' + encodeURIComponent(role.slug || role.role_id));
}
function markApplied(role) {
  sessionStorage.setItem(APPLIED_KEY, JSON.stringify({
    at: Date.now(),
    role_id: role.role_id,
    role_title: role.title,
    role_slug: role.slug,
    category: role.category
  }));
}
function readApplied() {
  try {
    const data = JSON.parse(sessionStorage.getItem(APPLIED_KEY) || 'null');
    if (!data || !data.at || !data.role_id) return null;
    if (Date.now() - data.at > 6 * 60 * 60 * 1000) return null;
    return data;
  } catch (e) {
    return null;
  }
}
function isSafeWhatsAppUrl(url) {
  if (!url) return false;
  try {
    const u = new URL(String(url).trim());
    if (u.protocol !== 'https:' && u.protocol !== 'http:') return false;
    const host = u.hostname.replace(/^www\./, '').toLowerCase();
    return host === 'chat.whatsapp.com' || host === 'wa.me' || host === 'api.whatsapp.com' || host.endsWith('.whatsapp.com');
  } catch (e) {
    return false;
  }
}
const WORK_TYPES = [
  { id: 'ALL', num: '00', label: 'ALL' },
  { id: 'FULL-TIME', num: '01', label: 'FULL-TIME' },
  { id: 'INTERNSHIP', num: '02', label: 'INTERNSHIPS' },
  { id: 'FREELANCE', num: '03', label: 'FREELANCE + PROJECT BASIS' }
];
const DEPTS = ['ALL','CONTENT','EDITING','PRODUCTION','CREATOR','AI + PERFORMANCE'];

function track(name, params) {
  try {
    if (typeof window.gtag === 'function') window.gtag('event', name, params || {});
    const p = params || {};
    const pixel = window.respawnPixel && window.respawnPixel.track
      ? window.respawnPixel.track
      : function () {};
    if (name === 'career_application_success') {
      pixel('Lead', { content_name: p.role_title || 'Career application', content_category: p.category || 'careers' });
    }
  } catch (e) {}
}

function captureUtm() {
  const q = new URLSearchParams(window.location.search);
  const utm = {};
  UTM_KEYS.forEach((k) => { utm[k] = q.get(k) || ''; });
  utm.referrer = document.referrer || '';
  const prev = JSON.parse(sessionStorage.getItem('respawn_careers_utm') || '{}');
  const merged = { ...prev };
  UTM_KEYS.forEach((k) => { if (utm[k]) merged[k] = utm[k]; });
  if (utm.referrer) merged.referrer = utm.referrer;
  sessionStorage.setItem('respawn_careers_utm', JSON.stringify(merged));
  return merged;
}

function Logo({ size = 44 }) {
  return <img src="/assets/logo-white.png" alt="Respawn Media" style={{ height: size, width: 'auto', display: 'block', userSelect: 'none' }} draggable={false} />;
}

function Nav() {
  const [open, setOpen] = useState(false);
  const links = [
    ['/#clients', 'Clients'],
    ['/#work', 'Work'],
    ['/#who', 'Who Are We'],
    ['/#services', 'Services'],
    ['/#contact', 'Contact']
  ];
  return (
    <nav>
      <a href="/" aria-label="Respawn Media home"><Logo size={36} /></a>
      <div className="desk-nav">
        {links.map(([href, label]) => <a key={href} className="nav-a" href={href}>{label}</a>)}
        <a className="nav-a is-on" href="/careers" aria-current="page">Careers</a>
        <a className="nav-cta" href="/#contact">Let's Talk</a>
      </div>
      <button className="ham" aria-label={open ? 'Close menu' : 'Open menu'} aria-expanded={open} onClick={() => setOpen((o) => !o)}>
        {[0,1,2].map((i) => <span key={i} style={{ display:'block', width:22, height:2, background: open && i===1 ? 'transparent' : 'var(--teal)', transform: open ? (i===0 ? 'rotate(45deg) translate(4px,5px)' : i===2 ? 'rotate(-45deg) translate(4px,-5px)' : 'none') : 'none' }} />)}
      </button>
      {open && (
        <div className="drawer">
          {links.map(([href, label]) => <a key={href} href={href} onClick={() => setOpen(false)}>{label.toUpperCase()}</a>)}
          <a href="/careers" onClick={() => setOpen(false)}>CAREERS</a>
          <a className="nav-cta" href="/#contact" onClick={() => setOpen(false)}>LET'S TALK</a>
        </div>
      )}
    </nav>
  );
}

function pad(n) { return String(n).padStart(2, '0'); }

function statusLabel(status) {
  if (status === 'ALWAYS_OPEN') return 'ALWAYS OPEN';
  return status || '';
}

function typeLabel(cat) {
  if (cat === 'INTERNSHIP') return 'Internship';
  if (cat === 'FREELANCE') return 'Freelance';
  return 'Full-time';
}

function isBlankAnswer(q, value, resume) {
  if (q.type === 'file') return !resume;
  if (q.type === 'checkbox') return !value;
  if (q.type === 'multiselect') return !value || !value.length;
  if (value === undefined || value === null) return true;
  return String(value).trim() === '';
}

function isSkippedLink(val) {
  var s = String(val || '').trim().toLowerCase();
  return s === 'n/a' || s === 'na' || s === 'none' || s === '-' || s === 'nil' || s === 'no';
}

function normalizeLinkAnswer(val) {
  var s = String(val == null ? '' : val).trim();
  if (!s || isSkippedLink(s)) return s || 'N/A';
  if (/^https?:\/\//i.test(s)) return s;
  if (s.charAt(0) === '@') return 'https://instagram.com/' + s.slice(1);
  if (s.indexOf('.') !== -1 || s.indexOf('/') !== -1) return 'https://' + s.replace(/^\/\//, '');
  return s;
}

function answersForSubmit(questions, answers) {
  var out = {};
  Object.keys(answers || {}).forEach(function (k) { out[k] = answers[k]; });
  (questions || []).forEach(function (q) {
    if (q.type !== 'url') return;
    if (out[q.question_key] == null || out[q.question_key] === '') return;
    out[q.question_key] = normalizeLinkAnswer(out[q.question_key]);
  });
  return out;
}

function Field({ q, value, onChange, fileName }) {
  const id = 'q-' + q.question_id;
  const req = <span className="req" aria-hidden="true">*</span>;
  if (q.type === 'textarea') {
    return (
      <div className="field">
        <label htmlFor={id}>{q.label}{req}</label>
        <textarea id={id} required placeholder={q.placeholder || ''} value={value || ''} onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  if (q.type === 'select') {
    return (
      <div className="field">
        <label htmlFor={id}>{q.label}{req}</label>
        <select id={id} required value={value || ''} onChange={(e) => onChange(e.target.value)}>
          <option value="">Select</option>
          {(q.options || []).map((o) => <option key={o} value={o}>{o}</option>)}
        </select>
      </div>
    );
  }
  if (q.type === 'multiselect') {
    const selected = Array.isArray(value) ? value : (value ? String(value).split(',').map((s) => s.trim()).filter(Boolean) : []);
    const toggle = (o) => {
      const next = selected.includes(o) ? selected.filter((x) => x !== o) : selected.concat(o);
      onChange(next);
    };
    return (
      <div className="field">
        <span id={id}>{q.label}{req}</span>
        <div className="check-row" role="group" aria-labelledby={id}>
          {(q.options || []).map((o) => (
            <label key={o}>
              <input type="checkbox" checked={selected.includes(o)} onChange={() => toggle(o)} />
              {o}
            </label>
          ))}
        </div>
      </div>
    );
  }
  if (q.type === 'checkbox') {
    return (
      <div className="field">
        <label htmlFor={id} style={{ textTransform:'none', letterSpacing:0, fontFamily:'var(--font-body)', fontSize:15 }}>
          <input id={id} type="checkbox" required checked={!!value} onChange={(e) => onChange(e.target.checked)} /> {q.label}{req}
        </label>
      </div>
    );
  }
  if (q.type === 'file') {
    return (
      <div className="field">
        <label htmlFor={id}>{q.label}{req}</label>
        <input id={id} type="file" accept=".pdf,.doc,.docx,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document" required={!fileName} onChange={(e) => onChange(e.target.files && e.target.files[0])} />
        <span className="meta">{fileName ? fileName : (q.placeholder || 'PDF, DOC or DOCX. Max 10 MB.')}</span>
      </div>
    );
  }
  const inputType = ['email','tel','number'].indexOf(q.type) >= 0 ? q.type : 'text';
  return (
    <div className="field">
      <label htmlFor={id}>{q.label}{req}</label>
      <input id={id} type={inputType} inputMode={q.type === 'url' ? 'url' : undefined} required placeholder={q.placeholder || (q.type === 'url' ? 'https://… or N/A' : '')} value={value || ''} onChange={(e) => onChange(e.target.value)} />
    </div>
  );
}

function ApplyForm({ role, universalQuestions, onClose, onSuccess, utm }) {
  const [step, setStep] = useState(1);
  const [answers, setAnswers] = useState({});
  const [resume, setResume] = useState(null);
  const [honeypot, setHoneypot] = useState('');
  const [error, setError] = useState('');
  const [busy, setBusy] = useState(false);
  const uni = (universalQuestions || []).slice().sort((a,b) => a.sort_order - b.sort_order);
  const spec = (role.questions || []).slice().sort((a,b) => a.sort_order - b.sort_order);

  const setVal = (key, v) => setAnswers((prev) => ({ ...prev, [key]: v }));

  const validateGroup = (qs) => {
    for (let i = 0; i < qs.length; i++) {
      const q = qs[i];
      if (q.type === 'file') {
        if (!resume) return 'Add a resume (PDF, DOC or DOCX, max 10 MB).';
        continue;
      }
      if (isBlankAnswer(q, answers[q.question_key], resume)) return 'Please complete: ' + q.label;
      if (q.type === 'email') {
        const email = String(answers[q.question_key] || '');
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return 'Enter a valid email address.';
      }
    }
    return '';
  };

  const go = (next) => {
    setError('');
    if (next === 3) {
      const msg = validateGroup(uni);
      if (msg) { setError(msg); return; }
    }
    if (next === 4) {
      const msg = validateGroup(spec);
      if (msg) { setError(msg); return; }
    }
    setStep(next);
  };

  const submit = async () => {
    setError('');
    const missing = validateGroup(uni) || validateGroup(spec);
    if (missing) { setError(missing); return; }
    if (resume) {
      const ext = (resume.name.split('.').pop() || '').toLowerCase();
      if (['pdf','doc','docx'].indexOf(ext) === -1) { setError('Resume must be PDF, DOC or DOCX.'); return; }
      if (resume.size > 10 * 1024 * 1024) { setError('Resume is too large. Max 10 MB.'); return; }
    }
    setBusy(true);
    track('career_application_submit', { role_id: role.role_id, role_title: role.title, category: role.category });
    const ac = typeof AbortController !== 'undefined' ? new AbortController() : null;
    const timer = setTimeout(function () { if (ac) ac.abort(); }, 28000);
    let succeeded = false;
    try {
      const fd = new FormData();
      fd.append('website', honeypot);
      fd.append('payload', JSON.stringify({
        role_id: role.role_id,
        answers: answersForSubmit(uni.concat(spec), answers),
        utm_source: utm.utm_source || '',
        utm_medium: utm.utm_medium || '',
        utm_campaign: utm.utm_campaign || '',
        utm_content: utm.utm_content || '',
        utm_term: utm.utm_term || '',
        referrer: utm.referrer || ''
      }));
      if (resume) fd.append('resume', resume, resume.name);
      const res = await fetch('/api/careers/apply', { method: 'POST', body: fd, signal: ac ? ac.signal : undefined });
      const text = await res.text();
      let data = {};
      try { data = text ? JSON.parse(text) : {}; } catch (e) { data = {}; }
      const httpOk = res.status >= 200 && res.status < 300;
      if (httpOk && data && data.ok === true) {
        succeeded = true;
        onSuccess();
        return;
      }
      if (res.status === 409 || (data && data.error === 'role_closed')) {
        setError('This role is no longer accepting applications.');
        return;
      }
      if (data && data.error === 'missing_field') { setError('Please complete every question before submitting.'); return; }
      if (data && data.error === 'resume_required') { setError('Add a resume (PDF, DOC or DOCX, max 10 MB).'); return; }
      if (data && data.error === 'invalid_url') { setError('Please complete every question before submitting.'); return; }
      if (data && data.error === 'file_too_large') { setError('Resume is too large for upload. Try a file under 6 MB (hosting limit) / 10 MB max.'); return; }
      if (data && data.error === 'upload_failed') { setError('Resume upload failed. Try again.'); return; }
      setError('Submission failed. Try again in a moment.');
    } catch (e) {
      setError('Submission failed. Try again in a moment.');
    } finally {
      clearTimeout(timer);
      if (!succeeded) setBusy(false);
    }
  };

  const reviewList = uni.concat(spec).filter((q) => q.type !== 'file');

  return (
    <div className="apply-panel" role="region" aria-label={'Apply for ' + role.title}>
      <div className="steps" aria-label="Application steps">
        {['01 Confirm','02 You','03 Role','04 Review'].map((s, i) => (
          <span key={s} className={step === i + 1 ? 'is-on' : ''}>{s}</span>
        ))}
      </div>
      {step === 1 && (
        <div>
          <p className="lede" style={{ marginTop: 0 }}>You are applying for <strong>{role.title}</strong> — {role.location} · {role.work_mode}.</p>
          <div className="cta-row">
            <button className="btn btn-primary" type="button" onClick={() => setStep(2)}>Continue</button>
            <button className="btn btn-ghost" type="button" onClick={onClose}>Cancel</button>
          </div>
        </div>
      )}
      {step === 2 && (
        <form onSubmit={(e) => { e.preventDefault(); go(3); }}>
          <p className="meta" style={{ marginBottom: '1.1rem' }}>Every question is required. If something does not apply, write N/A.</p>
          <div className="hp" aria-hidden="true">
            <label>Website<input tabIndex={-1} autoComplete="off" value={honeypot} onChange={(e) => setHoneypot(e.target.value)} /></label>
          </div>
          {uni.filter((q) => q.type !== 'file').map((q) => (
            <Field key={q.question_id} q={q} value={answers[q.question_key]} onChange={(v) => setVal(q.question_key, v)} />
          ))}
          {uni.filter((q) => q.type === 'file').map((q) => (
            <Field key={q.question_id} q={q} fileName={resume && resume.name} onChange={(f) => setResume(f || null)} />
          ))}
          {error && <p className="err" role="alert">{error}</p>}
          <div className="cta-row">
            <button className="btn btn-ghost" type="button" onClick={() => setStep(1)}>Back</button>
            <button className="btn btn-primary" type="submit">Continue</button>
          </div>
        </form>
      )}
      {step === 3 && (
        <form onSubmit={(e) => { e.preventDefault(); go(4); }}>
          {spec.length === 0 && <p className="lede" style={{ marginTop: 0 }}>No extra questions for this role.</p>}
          {spec.length > 0 && <p className="meta" style={{ marginBottom: '1.1rem' }}>Every role question is required. If something does not apply, write N/A.</p>}
          {spec.map((q) => (
            <Field key={q.question_id} q={q} value={answers[q.question_key]} fileName={resume && resume.name} onChange={(v) => q.type === 'file' ? setResume(v || null) : setVal(q.question_key, v)} />
          ))}
          {error && <p className="err" role="alert">{error}</p>}
          <div className="cta-row">
            <button className="btn btn-ghost" type="button" onClick={() => setStep(2)}>Back</button>
            <button className="btn btn-primary" type="submit">Review</button>
          </div>
        </form>
      )}
      {step === 4 && (
        <div>
          <p className="lede" style={{ marginTop: 0 }}>Check this once, then send.</p>
          <p className="meta"><strong>{role.title}</strong></p>
          {reviewList.map((q) => (
            <p key={q.question_id} className="meta"><span style={{ color: 'rgba(255,255,255,0.45)' }}>{q.label}: </span>{Array.isArray(answers[q.question_key]) ? answers[q.question_key].join(', ') : String(answers[q.question_key] || '—')}</p>
          ))}
          <p className="meta">Resume: {resume ? resume.name : '—'}</p>
          {error && <p className="err" role="alert">{error}</p>}
          <div className="cta-row">
            <button className="btn btn-ghost" type="button" onClick={() => setStep(3)} disabled={busy}>Back</button>
            <button className="btn btn-primary" type="button" onClick={submit} disabled={busy}>{busy ? 'Submitting…' : 'Submit'}</button>
          </div>
        </div>
      )}
    </div>
  );
}

  const route = parseCareersRoute();
  const [config, setConfig] = useState(null);
  const [loadError, setLoadError] = useState(false);
  const [utm, setUtm] = useState({});

  useEffect(() => {
    setUtm(captureUtm());
    fetch('/api/careers/config')
      .then((r) => r.json())
      .then((data) => {
        if (!data || !data.ok) setLoadError(true);
        else setConfig(data.data || data);
      })
      .catch(() => setLoadError(true));
  }, []);

  if (route.page === 'thanks') return <ThanksPage config={config} />;
  if (route.page === 'apply') return <ApplyPage slug={route.slug} config={config} loadError={loadError} utm={utm} />;
  return <ListingPage config={config} loadError={loadError} />;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
