<script type="text/babel">
const { useState, useEffect, useRef } = React;

const UTM_KEYS = ['utm_source','utm_medium','utm_campaign','utm_content','utm_term'];
const APPLIED_KEY = 'respawn_careers_applied';
const LIST_TITLE = 'Careers & Freelance Opportunities | Respawn Media Chennai';
const WHATSAPP_GROUP_URL = 'https://chat.whatsapp.com/LHZCScn664h3zTtTVUtaLv';

function careersSearch() {
  return window.location.search || '';
}
function careersHref(path) {
  return path + careersSearch();
}
function parseCareersRoute() {
  const path = (window.location.pathname || '').replace(/\/+$/, '') || '/';
  if (path === '/careers/thanks') return { page: 'thanks' };
  const m = path.match(/^\/careers\/apply\/([^/]+)$/);
  if (m) return { page: 'apply', slug: decodeURIComponent(m[1]) };
  return { page: 'list' };
}
function applyHref(role) {
  return careersHref('/careers/apply/' + encodeURIComponent(role.slug || role.role_id));
}
function markApplied(role) {
  sessionStorage.setItem(APPLIED_KEY, JSON.stringify({
    at: Date.now(),
    role_id: role.role_id,
    role_title: role.title,
    role_slug: role.slug,
    category: role.category
  }));
}
function readApplied() {
  try {
    const data = JSON.parse(sessionStorage.getItem(APPLIED_KEY) || 'null');
    if (!data || !data.at || !data.role_id) return null;
    if (Date.now() - data.at > 6 * 60 * 60 * 1000) return null;
    return data;
  } catch (e) {
    return null;
  }
}
function isSafeWhatsAppUrl(url) {
  if (!url) return false;
  try {
    const u = new URL(String(url).trim());
    if (u.protocol !== 'https:' && u.protocol !== 'http:') return false;
    const host = u.hostname.replace(/^www\./, '').toLowerCase();
    return host === 'chat.whatsapp.com' || host === 'wa.me' || host === 'api.whatsapp.com' || host.endsWith('.whatsapp.com');
  } catch (e) {
    return false;
  }
}
const WORK_TYPES = [
  { id: 'ALL', num: '00', label: 'ALL' },
  { id: 'FULL-TIME', num: '01', label: 'FULL-TIME' },
  { id: 'INTERNSHIP', num: '02', label: 'INTERNSHIPS' },
  { id: 'FREELANCE', num: '03', label: 'FREELANCE + PROJECT BASIS' }
];
const DEPTS = ['ALL','CONTENT','EDITING','PRODUCTION','CREATOR','AI + PERFORMANCE'];

function track(name, params) {
  try {
    if (typeof window.gtag === 'function') window.gtag('event', name, params || {});
    const p = params || {};
    const pixel = window.respawnPixel && window.respawnPixel.track
      ? window.respawnPixel.track
      : function () {};
    if (name === 'career_application_success') {
      pixel('Lead', { content_name: p.role_title || 'Career application', content_category: p.category || 'careers' });
    }
  } catch (e) {}
}

function captureUtm() {
  const q = new URLSearchParams(window.location.search);
  const utm = {};
  UTM_KEYS.forEach((k) => { utm[k] = q.get(k) || ''; });
  utm.referrer = document.referrer || '';
  const prev = JSON.parse(sessionStorage.getItem('respawn_careers_utm') || '{}');
  const merged = { ...prev };
  UTM_KEYS.forEach((k) => { if (utm[k]) merged[k] = utm[k]; });
  if (utm.referrer) merged.referrer = utm.referrer;
  sessionStorage.setItem('respawn_careers_utm', JSON.stringify(merged));
  return merged;
}

      </div>

function pad(n) { return String(n).padStart(2, '0'); }

function statusLabel(status) {
  if (status === 'ALWAYS_OPEN') return 'ALWAYS OPEN';
  return status || '';
}

function typeLabel(cat) {
  if (cat === 'INTERNSHIP') return 'Internship';
  if (cat === 'FREELANCE') return 'Freelance';
  return 'Full-time';
}

function isBlankAnswer(q, value, resume) {
  if (q.type === 'file') return !resume;
  if (q.type === 'checkbox') return !value;
  if (q.type === 'multiselect') return !value || !value.length;
  if (value === undefined || value === null) return true;
  return String(value).trim() === '';
}

function isSkippedLink(val) {
  var s = String(val || '').trim().toLowerCase();
  return s === 'n/a' || s === 'na' || s === 'none' || s === '-' || s === 'nil' || s === 'no';
}

function normalizeLinkAnswer(val) {
  var s = String(val == null ? '' : val).trim();
  if (!s || isSkippedLink(s)) return s;
  if (/^https?:\/\//i.test(s)) return s;
  if (s.charAt(0) === '@') return 'https://instagram.com/' + s.slice(1);
  return s;
}

function answersForSubmit(questions, answers) {
  var out = {};
  Object.keys(answers || {}).forEach(function (k) { out[k] = answers[k]; });
  (questions || []).forEach(function (q) {
    var key = q.question_key;
    if (isInstagramKey(key)) {
      var s = String(out[key] == null ? '' : out[key]).trim();
      out[key] = (!s || isSkippedLink(s)) ? 'no' : normalizeLinkAnswer(s);
      return;
    }
    if (out[key] == null) out[key] = '';
    if (q.type === 'url' && String(out[key]).trim()) {
      out[key] = normalizeLinkAnswer(out[key]);
    }
  });
  if (!String(out.instagram || '').trim()) out.instagram = 'no';
  return out;
}

function fieldHelp(q) {
  if (q && q.help) return String(q.help);
  var map = {
    full_name: 'Your full name as we should address you.',
    whatsapp: 'WhatsApp number with country code, for example +91…',
    email: 'We will use this email to contact you about this role.',
    portfolio_urls: 'Your work links. www.yoursite.com is enough — https is not required.',
    resume: 'PDF, DOC or DOCX. Please keep your file under 5 MB.',
    years_experience: 'Years working in this kind of role. Write 0 if you are starting out.',
    current_city: 'The city you are based in right now.',
    intern_current_city: 'The city you are based in right now.',
    cd_city: 'The city you are based in right now.',
    ugc_city: 'The city you are based in right now.',
    instagram: 'Optional. Leave it blank and we will record no.',
    instagram_if_relevant: 'Optional. Leave it blank and we will record no.',
    cd_instagram: 'Optional. Leave it blank and we will record no.',
    ig_profile: 'Optional. Leave it blank and we will record no.',
    social_profiles: 'Optional. Leave blank, write no, or paste your profiles.',
    availability: 'When you can start. A date or a short note such as immediate or 30 days is enough.',
    join_timeline: 'When you can start. A date or a short note such as immediate or 30 days is enough.',
    cd_availability: 'When you can start. A date or a short note such as immediate or 30 days is enough.',
    typical_availability: 'When you can start. A date or a short note such as immediate or 30 days is enough.',
    current_availability: 'When you can start. A date or a short note such as immediate or 30 days is enough.',
    willing_onsite: 'Are you willing to work from the office? Answer Yes or No.',
    chennai_wfo_confirm: 'Are you willing to work on-site from the office? Answer Yes or No.',
    chennai_office: 'Are you willing to work on-site from the office? Answer Yes or No.',
    chennai_availability: 'Are you willing to work on-site in Chennai? Answer Yes, Sometimes, or No.',
    languages: 'Languages you can speak or work in.',
    languages_understood: 'Languages you can comfortably understand while editing.',
    best_language: 'The language you are strongest in.',
    previous_ctc: 'Last drawn annual CTC in INR.',
    current_ctc: 'Current annual CTC in INR. Write N/A if you are not employed.',
    expected_ctc: 'Expected annual CTC in INR.',
    expected_commercials: 'Your expected day or project rate.',
    why_respawn: 'A short, honest note. Why this desk, not any design job.'
  };
  return map[q && q.question_key] || '';
}

function isInstagramKey(key) {
  var k = String(key || '').toLowerCase();
  return k === 'instagram' || k === 'instagram_if_relevant' || k === 'cd_instagram' || k === 'ig_profile';
}

function isRequired(q, role) {
  var key = String((q && q.question_key) || '').toLowerCase();
  if (isInstagramKey(key)) return false;
  if (['full_name', 'email', 'whatsapp', 'resume', 'portfolio_urls', 'years_experience', 'current_city', 'intern_current_city', 'cd_city', 'ugc_city', 'availability', 'join_timeline', 'cd_availability', 'typical_availability', 'current_availability', 'willing_onsite', 'chennai_wfo_confirm', 'chennai_office', 'chennai_availability', 'languages', 'languages_understood', 'best_language', 'why_respawn', 'design_tools', 'strongest_design_work'].indexOf(key) !== -1) return true;
  var cat = String((role && role.category) || '').toUpperCase().replace(/[\s-]+/g, '_');
  if (cat === 'INTERNSHIP') return false;
  if (['previous_ctc', 'current_ctc', 'expected_ctc'].indexOf(key) !== -1) return cat === 'FULL_TIME';
  if (key === 'expected_commercials') return cat === 'FREELANCE' || cat === 'FULL_TIME';
  return false;
}

function isCoreFieldClient(key, role) {
  return isRequired({ question_key: key }, role);
}

function Field({ q, value, onChange, fileName, required }) {
  const id = 'q-' + q.question_id;
  const fieldClass = 'field' + (required ? ' is-required' : '');
  const reqMark = required ? <span className="req" aria-hidden="true">*</span> : <span className="opt">optional</span>;
  const help = fieldHelp(q);
  const helpEl = help ? <p className="field-help">{help}</p> : null;
  if (q.type === 'textarea') {
    return (
      <div className={fieldClass}>
        <label htmlFor={id}>{q.label}{reqMark}</label>
        {helpEl}
        <textarea id={id} required={required} placeholder={q.placeholder || ''} value={value || ''} onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  if (q.type === 'select') {
    return (
      <div className={fieldClass}>
        <label htmlFor={id}>{q.label}{reqMark}</label>
        {helpEl}
        <select id={id} required={required} value={value || ''} onChange={(e) => onChange(e.target.value)}>
          <option value="">Select</option>
          {(q.options || []).map((o) => <option key={o} value={o}>{o}</option>)}
        </select>
      </div>
    );
  }
  if (q.type === 'multiselect') {
    const selected = Array.isArray(value) ? value : (value ? String(value).split(',').map((s) => s.trim()).filter(Boolean) : []);
    const toggle = (o) => {
      const next = selected.includes(o) ? selected.filter((x) => x !== o) : selected.concat(o);
      onChange(next);
    };
    return (
      <div className={fieldClass}>
        <span id={id}>{q.label}{reqMark}</span>
        {helpEl}
        <div className="check-row" role="group" aria-labelledby={id}>
          {(q.options || []).map((o) => (
            <label key={o}>
              <input type="checkbox" checked={selected.includes(o)} onChange={() => toggle(o)} />
              {o}
            </label>
          ))}
        </div>
      </div>
    );
  }
  if (q.type === 'checkbox') {
    return (
      <div className={fieldClass}>
        <label htmlFor={id} style={{ textTransform:'none', letterSpacing:0, fontFamily:'var(--font-body)', fontSize:15 }}>
          <input id={id} type="checkbox" required={required} checked={!!value} onChange={(e) => onChange(e.target.checked)} /> {q.label}{reqMark}
        </label>
        {helpEl}
      </div>
    );
  }
  if (q.type === 'file') {
    return (
      <div className={fieldClass}>
        <label htmlFor={id}>{q.label}{reqMark}</label>
        {helpEl}
        <input id={id} type="file" accept=".pdf,.doc,.docx,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document" required={required && !fileName} onChange={(e) => onChange(e.target.files && e.target.files[0])} />
        <span className="meta">{fileName ? fileName : 'PDF, DOC or DOCX. Under 5 MB.'}</span>
      </div>
    );
  }
  const inputType = ['email','tel','number'].indexOf(q.type) >= 0 ? q.type : 'text';
  const ph = q.placeholder || (isInstagramKey(q.question_key) ? 'optional — leave blank if none' : (q.type === 'url' ? 'www.yoursite.com' : ''));
  return (
    <div className={fieldClass}>
      <label htmlFor={id}>{q.label}{reqMark}</label>
      {helpEl}
      <input id={id} type={inputType} inputMode={q.type === 'url' ? 'url' : undefined} required={required} placeholder={ph} value={value || ''} onChange={(e) => onChange(e.target.value)} />
    </div>
  );
}

function ApplyForm({ role, universalQuestions, onClose, onSuccess, utm, onBegin, onAbort }) {
  const [step, setStep] = useState(1);
  const [answers, setAnswers] = useState({});
  const [resume, setResume] = useState(null);
  const [honeypot, setHoneypot] = useState('');
  const [error, setError] = useState('');
  const [busy, setBusy] = useState(false);
  const panelRef = useRef(null);
  useEffect(() => {
    if (step < 2) return;
    const heading = panelRef.current && panelRef.current.querySelector('.step-heading');
    if (heading) heading.focus({ preventScroll: true });
    window.scrollTo({ top: 0, left: 0, behavior: 'instant' });
  }, [step]);
  const uni = (universalQuestions || []).slice().sort((a,b) => a.sort_order - b.sort_order);
  const spec = (role.questions || []).slice().sort((a,b) => a.sort_order - b.sort_order);

  const setVal = (key, v) => setAnswers((prev) => ({ ...prev, [key]: v }));

  const validateGroup = (qs) => {
    for (let i = 0; i < qs.length; i++) {
      const q = qs[i];
      const need = isRequired(q, role);
      if (q.type === 'file') {
        if (need && !resume) return 'Add a resume (PDF, DOC or DOCX, under 5 MB).';
        continue;
      }
      if (!need) {
        if (q.type === 'email' && answers[q.question_key] && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(answers[q.question_key]))) {
          return 'Enter a valid email address.';
        }
        continue;
      }
      if (isBlankAnswer(q, answers[q.question_key], resume)) return 'Please complete: ' + q.label;
      if (q.type === 'email') {
        const email = String(answers[q.question_key] || '');
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return 'Enter a valid email address.';
      }
    }
    return '';
  };

  const startApply = () => {
    setError('');
    setStep(2);
    if (onBegin) onBegin();
  };

  const backToIntro = () => {
    setError('');
    setStep(1);
    if (onAbort) onAbort();
  };

  const go = (next) => {
    setError('');
    if (next === 3) {
      const msg = validateGroup(uni);
      if (msg) { setError(msg); return; }
    }
    if (next === 4) {
      const msg = validateGroup(spec);
      if (msg) { setError(msg); return; }
    }
    setStep(next);
  };

  const submit = async () => {
    setError('');
    const missing = validateGroup(uni) || validateGroup(spec);
    if (missing) { setError(missing); return; }
    if (resume) {
      const ext = (resume.name.split('.').pop() || '').toLowerCase();
      if (['pdf','doc','docx'].indexOf(ext) === -1) { setError('Resume must be PDF, DOC or DOCX.'); return; }
      if (resume.size > 5.5 * 1024 * 1024) { setError('Resume is too large to send from the site. Use a PDF under 5 MB.'); return; }
    }
    setBusy(true);
    track('career_application_submit', { role_id: role.role_id, role_title: role.title, category: role.category });
    const ac = typeof AbortController !== 'undefined' ? new AbortController() : null;
    const timer = setTimeout(function () { if (ac) ac.abort(); }, 55000);
    let succeeded = false;
    try {
      const fd = new FormData();
      fd.append('hp_confirm', honeypot);
      fd.append('payload', JSON.stringify({
        role_id: role.role_id,
        answers: answersForSubmit(uni.concat(spec), answers),
        questions: uni.concat(spec).map(function (q) {
          return { question_key: q.question_key, type: q.type };
        }),
        category: role.category || '',
        utm_source: utm.utm_source || '',
        utm_medium: utm.utm_medium || '',
        utm_campaign: utm.utm_campaign || '',
        utm_content: utm.utm_content || '',
        utm_term: utm.utm_term || '',
        referrer: utm.referrer || ''
      }));
      if (resume) fd.append('resume', resume, resume.name);
      const res = await fetch('/api/careers/apply', { method: 'POST', body: fd, signal: ac ? ac.signal : undefined });
      const text = await res.text();
      let data = {};
      try { data = text ? JSON.parse(text) : {}; } catch (e) { data = {}; }
      const httpOk = res.status >= 200 && res.status < 300;
      if (httpOk && data && data.ok === true && !data.ignored) {
        succeeded = true;
        onSuccess(data.application_id || '');
        return;
      }
      if (res.status === 409 || (data && data.error === 'role_closed')) {
        setError('This role is no longer accepting applications.');
        return;
      }
      if (data && data.error === 'missing_field' && data.field && isCoreFieldClient(data.field, role)) { setError('Please complete: ' + data.field); return; }
      if (data && data.error === 'missing_field') { setError('Please complete the required fields.'); return; }
      if (data && data.error === 'resume_required') { setError('Add a resume (PDF, DOC or DOCX, under 5 MB).'); return; }
      if (data && data.error === 'invalid_url') { setError('Use a site like www.yoursite.com for portfolio. Instagram can stay blank.'); return; }
      if (data && data.error === 'file_too_large') { setError('Resume is too large to send. Use a PDF under 5 MB.'); return; }
      if (data && data.error === 'upload_failed') { setError('Resume upload failed. Try a smaller PDF.'); return; }
      if (data && data.error === 'timeout') { setError('This is taking too long to confirm. Wait a minute, then try once more with a PDF under 5 MB.'); return; }
      setError('We could not confirm this application. Wait a minute and try once more. If it happens again, use a PDF under 5 MB.');
    } catch (e) {
      const aborted = e && (e.name === 'AbortError' || e.code === 20);
      setError(aborted
        ? 'This is taking too long to confirm. Wait a minute, then try once more with a PDF under 5 MB.'
        : 'We could not reach the server. Check your connection and try once more.');
    } finally {
      clearTimeout(timer);
      if (!succeeded) setBusy(false);
    }
  };

  const reviewList = uni.concat(spec).filter((q) => q.type !== 'file');

  return (
    <div ref={panelRef} className={'apply-panel' + (step > 1 ? ' is-filling' : '')} role="region" aria-label={'Apply for ' + role.title}>
      {step > 1 && (
        <div className="steps" aria-label="Application steps">
          {['01 You','02 Role','03 Review'].map((s, i) => (
            <span key={s} aria-current={step === i + 2 ? 'step' : undefined} className={step === i + 2 ? 'is-on' : step > i + 2 ? 'is-complete' : ''}>{s}</span>
          ))}
        </div>
      )}
      {step === 1 && (
        <div className="apply-intro">
          <h2>Sound like your kind of work?</h2>
          <p className="lede" style={{ marginTop: 0, textAlign: 'center' }}>Ready to apply for <strong>{role.title}</strong>?</p>
          <div className="cta-row" style={{ justifyContent: 'center' }}>
            <button className="btn btn-primary" type="button" onClick={startApply}>Start application</button>
            <button className="btn btn-ghost" type="button" onClick={onClose}>Cancel</button>
          </div>
        </div>
      )}
      {step === 2 && (
        <form onSubmit={(e) => { e.preventDefault(); go(3); }}>
          <h2 className="step-heading" tabIndex={-1}>A little about you.</h2>
          <p className="meta" style={{ marginBottom: '1.1rem' }}>Fields marked <span className="req">*</span> are required. Everything else is optional.</p>
          <div className="hp" aria-hidden="true">
            <label>Company fax<input name="hp_confirm" tabIndex={-1} autoComplete="off" value={honeypot} onChange={(e) => setHoneypot(e.target.value)} /></label>
          </div>
          {uni.filter((q) => q.type !== 'file').map((q) => (
            <Field key={q.question_id} q={q} required={isRequired(q, role)} value={answers[q.question_key]} onChange={(v) => setVal(q.question_key, v)} />
          ))}
          {uni.filter((q) => q.type === 'file').map((q) => (
            <Field key={q.question_id} q={q} required={isRequired(q, role)} fileName={resume && resume.name} onChange={(f) => setResume(f || null)} />
          ))}
          {error && <p className="err" role="alert">{error}</p>}
          <div className="cta-row">
            <button className="btn btn-ghost" type="button" onClick={backToIntro}>Back</button>
            <button className="btn btn-primary" type="submit">Continue</button>
          </div>
        </form>
      )}
      {step === 3 && (
        <form onSubmit={(e) => { e.preventDefault(); go(4); }}>
          <h2 className="step-heading" tabIndex={-1}>Your craft. Your experience.</h2>
          {spec.length === 0 && <p className="lede" style={{ marginTop: 0 }}>No extra questions for this role.</p>}
          {spec.length > 0 && <p className="meta" style={{ marginBottom: '1.1rem' }}>Only the fields marked <span className="req">*</span> are required for this role.</p>}
          {spec.map((q) => (
            <Field key={q.question_id} q={q} required={isRequired(q, role)} value={answers[q.question_key]} fileName={resume && resume.name} onChange={(v) => q.type === 'file' ? setResume(v || null) : setVal(q.question_key, v)} />
          ))}
          {error && <p className="err" role="alert">{error}</p>}
          <div className="cta-row">
            <button className="btn btn-ghost" type="button" onClick={() => setStep(2)}>Back</button>
            <button className="btn btn-primary" type="submit">Review</button>
          </div>
        </form>
      )}
      {step === 4 && (
        <div className="review-summary">
          <h2 className="step-heading" tabIndex={-1}>One last look.</h2>
          <p className="lede" style={{ marginTop: 0 }}>Check this once, then send.</p>
          <p className="meta"><strong>{role.title}</strong></p>
          {reviewList.map((q) => (
            <p key={q.question_id} className="meta"><span style={{ color: 'rgba(255,255,255,0.45)' }}>{q.label}: </span>{Array.isArray(answers[q.question_key]) ? answers[q.question_key].join(', ') : String(answers[q.question_key] || '—')}</p>
          ))}
          <p className="meta">Resume: {resume ? resume.name : '—'}</p>
          {busy && (
            <div className="submit-status" role="status" aria-live="polite">
              <strong>Sending your application</strong>
              <p>Please keep this page open. We are saving your answers and resume. This can take up to a minute. You will be moved to a thank-you page when it goes through.</p>
            </div>
          )}
          {error && <p className="err" role="alert">{error}</p>}
          <div className="cta-row">
            <button className="btn btn-ghost" type="button" onClick={() => setStep(3)} disabled={busy}>Back</button>
            <button className={'btn btn-primary' + (busy ? ' is-busy' : '')} type="button" onClick={submit} disabled={busy}>{busy ? 'Sending…' : 'Submit application'}</button>
          </div>
        </div>
      )}
    </div>
  );
}

function lookLinesFor(role) {
  var lines = LOOK_LINES[role && role.role_id];
  if (lines && lines.length) {
    return lines.map(function (line, i) {
      return { requirement_id: role.role_id + '-line-' + i, requirement: line.text, highlight: !!line.hi };
    });
  }
  return (role && role.requirements) || [];
}

function RoleCard({ role, selected, onDetails }) {
  const canApply = role.accepting_applications && role.status !== 'CLOSED';
  return (
    <article className={'job-card' + (selected ? ' is-on' : '')} id={role.slug}>
      <h3>{role.title}</h3>
      <div className="job-card-loc">
        <span>{role.location || 'Chennai'}</span>
        <span className="type-pill">{typeLabel(role.category)}</span>
      </div>
      <div className="tag-row">
        {role.experience ? <span className="tag tag-exp">{role.experience}</span> : null}
        {role.department ? <span className="tag tag-dept">{role.department}</span> : null}
      </div>
      <div className="job-card-actions">
        <button className="btn btn-ghost" type="button" aria-expanded={selected} onClick={onDetails}>{selected ? 'Hide details' : 'View details'}</button>
        {canApply
          ? <a className="btn btn-primary" href={applyHref(role)}>Apply</a>
          : <button className="btn btn-ghost" type="button" disabled>Closed</button>}
      </div>
    </article>

}

function RoleBrief({ role, freelanceIntro }) {
  const showFreelanceNote = role.category === 'FREELANCE';
  const lines = lookLinesFor(role);
  const facts = [
    ['Location', role.location || 'Chennai'],
    ['Work mode', role.work_mode],
    ['Schedule', role.schedule],
    ['Experience', role.experience],
    ['Pay', role.compensation]
  ].filter(function (row) { return row[1]; });
  return (
    <div className="role-brief">
      <p className="eyebrow">{typeLabel(role.category)}</p>
      <div className="role-heading">
        <h1>{role.title}</h1>
        <span className={'status status-' + String(role.status).toLowerCase()}>{statusLabel(role.status)}</span>
      </div>
      {facts.length > 0 && (
        <div className="role-facts">
          {facts.map(function (row) {
            return (
              <div key={row[0]}>
                <span>{row[0]}</span>
                <p>{row[1]}</p>
              </div>
            );
          })}
        </div>
      )}
      <div className="role-copy">
      {(showFreelanceNote && freelanceIntro) || role.full_description ? (
        <div>
          <h3>The role</h3>
          {showFreelanceNote && freelanceIntro && <p className="lede" style={{ marginTop: 0 }}>{freelanceIntro}</p>}
          {role.full_description && <p className="lede">{role.full_description}</p>}
        </div>
      ) : null}
      {lines.length > 0 && (
        <div>
          <h3>What we look for</h3>
          <div className="look-lines">
            {lines.map((r) => <p key={r.requirement_id} className={r.highlight ? 'hi' : ''}>{r.requirement}</p>)}
          </div>
        </div>
      )}
      </div>
    </div>
  );
}

function RoleDetails({ role, freelanceIntro }) {

    <div className="role-panel">
      <RoleBrief role={role} freelanceIntro={freelanceIntro} />

function PageFooter() {

function ListingPage({ config, loadError }) {
  const [workType, setWorkType] = useState('ALL');
  const [dept, setDept] = useState('ALL');
  const [loc, setLoc] = useState('ALL');
  const [openId, setOpenId] = useState('');

  useEffect(() => {
    document.title = LIST_TITLE;
    track('careers_view', {});
  }, []);

  useEffect(() => {
    if (!config) return;
    const hash = decodeURIComponent((window.location.hash || '').replace('#', ''));
    if (!hash) return;
    const role = (config.roles || []).find((r) => r.slug === hash || r.role_id === hash);
    if (role) {
      setOpenId(role.role_id);
      setWorkType('ALL');
      setTimeout(() => {
        const el = document.getElementById(role.slug);
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }, 80);
    }
  }, [config]);

  const settings = (config && config.settings) || {};
  const allRoles = (config && config.roles) || [];
  const filtered = allRoles.filter((r) => {
    if (workType !== 'ALL' && r.category !== workType) return false;
    if (dept !== 'ALL' && r.department !== dept) return false;
    if (loc !== 'ALL' && r.location !== loc) return false;
    return true;
  });
  const locations = Array.from(new Set(allRoles.map((r) => r.location).filter(Boolean)));
  const openRole = allRoles.find((r) => r.role_id === openId);
  const alwaysOpen = allRoles.filter((r) => r.status === 'ALWAYS_OPEN');
  const noneOpen = !loadError && config && allRoles.length === 0;

  const toggle = (role) => {
    const next = openId === role.role_id ? '' : role.role_id;
    setOpenId(next);
    track('career_role_expand', { role_id: role.role_id, role_title: role.title, category: role.category });
    if (next) {
      history.replaceState(null, '', '#' + role.slug);
      setTimeout(function () {
        const el = document.querySelector('#roles .role-panel');
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }, 50);
    }
  };

  const setType = (id) => {
    setWorkType(id);
    track('career_category_filter', { category: id });
  };

  return (
    <>
      <Nav />
      <section id="hero">
        <p className="eyebrow">{settings.hero_eyebrow || 'RESPAWN / CAREERS + COLLABORATORS'}</p>
        <h1>
          <span className="h1-line">MAKE GOOD STUFF</span>
          <span className="h1-line h1-accent">WITH US.</span>
        </h1>
        <p className="lede">{settings.hero_description || 'Full-time roles, paid internships and freelance collaborations for people who care about content, culture and craft.'}</p>
        <div className="cta-row">
          <a className="btn btn-primary" href="#roles">VIEW OPEN ROLES</a>
          <button className="btn btn-ghost" type="button" onClick={() => { setType('FREELANCE'); document.getElementById('roles') && document.getElementById('roles').scrollIntoView({ behavior: 'smooth' }); }}>JOIN OUR FREELANCE NETWORK →</button>
        </div>
      </section>

      <section id="roles">
        <p className="eyebrow">OPEN ROLES</p>
        <h2 style={{ marginTop: '0.5rem', maxWidth: '12ch' }}>FIND YOUR FIT.</h2>
        <div className="filters-bar">
          <label className="filter-field">
            <span>Work type</span>
            <select value={workType} onChange={(e) => setType(e.target.value)} aria-label="Work type">
              {WORK_TYPES.map((t) => <option key={t.id} value={t.id}>{t.id === 'ALL' ? 'All types' : t.label}</option>)}
            </select>
          </label>
          <label className="filter-field">
            <span>Department</span>
            <select value={dept} onChange={(e) => setDept(e.target.value)} aria-label="Department">
              {DEPTS.map((d) => <option key={d} value={d}>{d === 'ALL' ? 'All departments' : d}</option>)}
            </select>
          </label>
          <label className="filter-field">
            <span>Location</span>
            <select value={loc} onChange={(e) => setLoc(e.target.value)} aria-label="Location">
              <option value="ALL">All locations</option>
              {locations.map((l) => <option key={l} value={l}>{l}</option>)}
            </select>
          </label>
        </div>

        {loadError && (
          <div className="empty">
            <h2>ROLES ARE<br />OFFLINE.</h2>
            <p className="lede">The careers list could not load. Try again shortly, or write to {settings.careers_email || 'respawnmediain@gmail.com'}.</p>
          </div>
        )}

        {noneOpen && (
          <div className="empty">
            <h2>NOTHING OPEN<br />RIGHT NOW.</h2>
            <p className="lede">We're still building our freelance network.</p>
            {alwaysOpen.length > 0 && <p className="lede">Freelance collaborations below stay open.</p>}
          </div>
        )}

        {!loadError && config && filtered.length === 0 && allRoles.length > 0 && (
          <div className="empty">
            <h2>NOTHING IN<br />THIS FILTER.</h2>
            <p className="lede">Try All types, or switch department.</p>
            {alwaysOpen.length > 0 && workType !== 'FREELANCE' && (
              <button className="btn btn-ghost" type="button" onClick={() => setType('FREELANCE')}>Show freelance network →</button>
            )}
          </div>
        )}

        {!loadError && filtered.length > 0 && (
          <div className="job-grid">
            {filtered.map((role) => (
              <RoleCard
                key={role.role_id}
                role={role}
                selected={openId === role.role_id}
                onDetails={() => toggle(role)}
              />
            ))}
          </div>
        )}

        {openRole && (
          <RoleDetails
            role={openRole}
            freelanceIntro={settings.freelance_intro || ''}
          />
        )}
      </section>
      <PageFooter />
    </>
  );
}

function ApplyPage({ slug, config, loadError, utm }) {
  const settings = (config && config.settings) || {};
  const roles = (config && config.roles) || [];
  const role = roles.find((r) => r.slug === slug || r.role_id === slug);
  const canApply = role && role.accepting_applications && role.status !== 'CLOSED';
  const started = useRef(false);
  const [filling, setFilling] = useState(false);

  useEffect(() => {
    if (role) document.title = 'Apply: ' + role.title + ' | Respawn Media Careers';
    else document.title = 'Apply | Respawn Media Careers';
  }, [role]);

  useEffect(() => {
    if (!role || started.current) return;
    started.current = true;
    track('career_apply_start', { role_id: role.role_id, role_title: role.title, category: role.category });
  }, [role]);

  const back = careersHref('/careers');
  const jumpToForm = () => {
    setFilling(true);
    window.scrollTo(0, 0);
    requestAnimationFrame(function () {
      window.scrollTo({ top: 0, left: 0, behavior: 'smooth' });
    });
  };

  return (
    <>
      <Nav />
      <section className="apply-page">
        <p className="crumb"><a href={back}>Back to careers</a> <span aria-hidden="true">/</span> <span>Apply</span></p>
        {!config && !loadError && <p className="lede">Loading this role…</p>}
        {loadError && (
          <div className="empty">
            <h2>ROLES ARE<br />OFFLINE.</h2>
            <p className="lede">The application could not load. Try again shortly, or write to {settings.careers_email || 'respawnmediain@gmail.com'}.</p>
            <div className="cta-row"><a className="btn btn-ghost" href={back}>Back to open roles</a></div>
          </div>
        )}
        {!loadError && config && !role && (
          <div className="empty">
            <h2>ROLE NOT<br />FOUND.</h2>
            <p className="lede">This opening is not on the site anymore. Pick another role from the list.</p>
            <div className="cta-row"><a className="btn btn-primary" href={back}>Back to open roles</a></div>
          </div>
        )}
        {role && (
          <>
            {!filling && <RoleBrief role={role} freelanceIntro={role.category === 'FREELANCE' ? (settings.freelance_intro || '') : ''} />}
            {filling && <h1 className="apply-role-title">{role.title}</h1>}
            {canApply
              ? <ApplyForm
                  role={role}
                  universalQuestions={(config && config.universalQuestions) || []}
                  utm={utm}
                  onBegin={jumpToForm}
                  onAbort={() => setFilling(false)}
                  onClose={() => { window.location.href = back; }}
                  onSuccess={(applicationId) => {
                    markApplied(role);
                    var thanks = careersHref('/careers/thanks');
                    if (applicationId) thanks += (thanks.indexOf('?') >= 0 ? '&' : '?') + 'id=' + encodeURIComponent(applicationId);
                    window.location.href = thanks;
                  }}
                />
              : (
                <div className="empty" style={{ marginTop: '2rem' }}>
                  <p className="err" role="alert">This role is no longer accepting applications.</p>
                  <div className="cta-row"><a className="btn btn-primary" href={back}>Back to open roles</a></div>
                </div>
              )}
          </>
        )}
      </section>
      <PageFooter />
    </>
  );
}

function ThanksPage({ config }) {
  const [allowed, setAllowed] = useState(false);
  const applied = useRef(null);
  const fired = useRef(false);
  const settings = (config && config.settings) || {};

  useEffect(() => {
    const data = readApplied();
    if (!data) {
      window.location.replace(careersHref('/careers'));
      return;
    }
    applied.current = data;
    setAllowed(true);
    document.title = 'Thank you | Respawn Media Careers';
    if (!fired.current) {
      fired.current = true;
      track('career_application_success', { role_id: data.role_id, role_title: data.role_title, category: data.category });
    }
  }, []);

  if (!allowed) return null;

  const title = settings.thanks_title || 'THANK YOU SO MUCH.';
  const message = settings.thanks_message || 'We have noted your application and will get back to you soon. Till then, you can join our WhatsApp group, where we keep updating our regular hiring and this work.';
  const waRaw = String(settings.whatsapp_group_url || '').trim() || WHATSAPP_GROUP_URL;
  const wa = isSafeWhatsAppUrl(waRaw) ? waRaw : '';
  const waLabel = settings.whatsapp_button_label || 'Join WhatsApp group';
  const roleTitle = applied.current && applied.current.role_title;

  return (
    <>
      <Nav />
      <section className="thanks-page success">
        <p className="eyebrow">Application received</p>
        <h2>{title.split('\n').map((line, i) => <span key={i}>{i > 0 ? <br /> : null}{i === 0 ? <em>{line}</em> : line}</span>)}</h2>
        {roleTitle && <p className="meta">Role: {roleTitle}</p>}
        <p className="lede">{message}</p>
        <div className="cta-row">
          {wa
            ? <a className="btn btn-primary" href={wa} target="_blank" rel="noopener noreferrer">{waLabel}</a>
            : null}
          <a className="btn btn-ghost" href={careersHref('/careers')}>Back to open roles</a>
        </div>
      </section>
      <PageFooter />
    </>
  );
}

function App() {
  const route = parseCareersRoute();
  const [config, setConfig] = useState(null);
  const [loadError, setLoadError] = useState(false);
  const [utm, setUtm] = useState({});

  useEffect(() => {
    setUtm(captureUtm());
    fetch('/api/careers/config')
      .then((r) => r.json())
      .then((data) => {
        if (!data || !data.ok) setLoadError(true);
        else setConfig(data.data || data);
      })
      .catch(() => setLoadError(true));
  }, []);

  if (route.page === 'thanks') return <ThanksPage config={config} />;
  if (route.page === 'apply') return <ApplyPage slug={route.slug} config={config} loadError={loadError} utm={utm} />;
  return <ListingPage config={config} loadError={loadError} />;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
