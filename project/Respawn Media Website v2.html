function useInView(threshold = 0.1) {
  const ref = useRef(null);
  const [v, setV] = useState(false);
  useEffect(() => {
    const o = new IntersectionObserver(([e]) => {if (e.isIntersecting) setV(true);}, { threshold });
    if (ref.current) o.observe(ref.current);
    return () => o.disconnect();
  }, []);
  return [ref, v];
}

// Logo — PNG image. color='white' or 'black' determines which file to use
// Logo source is 1796x1091 (~1.647:1). `size` = height in px.
function Logo({ size = 44, variant = 'white', alt = 'Respawn Media' }) {
  const src = variant === 'black' ? LOGO_BLACK : LOGO_WHITE;
  return <img src={src} alt={alt} style={{ height: size, width: 'auto', display: 'block', userSelect: 'none' }} draggable={false} />;
}

// ─── FILE → DataURL HELPER ─────────────────────────────────────
function fileToDataURL(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}

// A reusable "Upload Image" button — accepts jpg/png/webp/gif
function ImageUploader({ value, onChange, label = 'Upload Image', accept = 'image/*' }) {
  const inputRef = useRef(null);
  const onPick = async (e) => {
    const f = e.target.files?.[0];
    if (!f) return;
    const url = await fileToDataURL(f);
    onChange(url);
  };
  const btnS = { background: 'var(--teal)', color: 'var(--black)', border: 'none', padding: '0.5rem 0.75rem', fontFamily: 'var(--font-condensed)', fontWeight: 800, fontSize: '11px', letterSpacing: '0.14em', textTransform: 'uppercase', cursor: 'pointer', flex: 1 };
  const clrS = { background: 'transparent', color: 'rgba(255,255,255,0.45)', border: '1px solid rgba(255,255,255,0.12)', padding: '0.5rem 0.75rem', fontFamily: 'var(--font-condensed)', fontWeight: 700, fontSize: '11px', letterSpacing: '0.12em', textTransform: 'uppercase', cursor: 'pointer' };
  return (
    <div style={{ marginBottom: 10 }}>
      <div style={{ display: 'flex', gap: 8, alignItems: 'center' }}>
        {value ?
        <div style={{ width: 48, height: 48, background: 'var(--black)', border: '1px solid var(--border)', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 4, flexShrink: 0 }}>
            <img src={value} alt="" style={{ maxWidth: '100%', maxHeight: '100%', objectFit: 'contain' }} />
          </div> :

        <div style={{ width: 48, height: 48, background: 'rgba(255,255,255,0.03)', border: '1px dashed rgba(255,255,255,0.1)', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 18, color: 'rgba(255,255,255,0.25)', flexShrink: 0 }}>↑</div>
        }
        <button type="button" style={btnS} onClick={() => inputRef.current?.click()}>{value ? 'Replace' : label}</button>
        {value && <button type="button" style={clrS} onClick={() => onChange('')}>Clear</button>}
        <input ref={inputRef} type="file" accept={accept} onChange={onPick} style={{ display: 'none' }} />
      </div>
    </div>);

}

function Eyebrow({ children, style = {} }) {

}

  const labels = { work: 'Work', clients: 'Clients', who: 'Who Are We', services: 'Services', contact: 'Contact' };
  return (

        onMouseEnter={(e) => e.target.style.color = 'var(--teal)'} onMouseLeave={(e) => e.target.style.color = active === l ? 'var(--teal)' : 'rgba(255,255,255,0.4)'}>{labels[l]}</a>

// ─── DRAG-SCRUB MARQUEE ───────────────────────────────────────
// Continuously auto-scrolls. User can click-and-drag (or swipe) to scrub;
// releases back to auto after 1.5s of idle. Children are looped (2x)
// to create seamless wrap-around.
function DragMarquee({ items, renderItem, speed = 40, direction = 'left', inView, gap = 20, idName }) {
  const scrollerRef = useRef(null);
  const trackRef = useRef(null);
  const stateRef = useRef({ dragging: false, startX: 0, startScroll: 0, lastInteract: 0, halfWidth: 0, raf: null, initialized: false });
  const [isDragging, setIsDragging] = useState(false);

  useEffect(() => {
    const scroller = scrollerRef.current;
    const track = trackRef.current;
    if (!scroller || !track) return;

    // Wait for layout, then measure half-track width (one copy of the items)
    const measure = () => {
      const hw = track.scrollWidth / 2;
      stateRef.current.halfWidth = hw;
      // For right-scrolling, we need to start from a mid position so we can scroll right (decrease scrollLeft)
      if (!stateRef.current.initialized && hw > 0) {
        scroller.scrollLeft = direction === 'right' ? hw : 0;
        stateRef.current.initialized = true;
      }
    };
    measure();
    const ro = new ResizeObserver(measure);
    ro.observe(track);

    let last = performance.now();
    const tick = (now) => {
      const s = stateRef.current;
      const dt = Math.min(64, now - last);
      last = now;
      const idle = now - s.lastInteract > 1500;
      if (!s.dragging && idle && inView && s.halfWidth > 0) {
        const dx = speed * dt / 1000 * (direction === 'right' ? -1 : 1);
        scroller.scrollLeft += dx;
      }
      // Wrap around for infinite loop
      if (s.halfWidth > 0) {
        if (scroller.scrollLeft >= s.halfWidth) scroller.scrollLeft -= s.halfWidth;
        if (scroller.scrollLeft <= 0) scroller.scrollLeft += s.halfWidth;
      }
      s.raf = requestAnimationFrame(tick);
    };
    stateRef.current.raf = requestAnimationFrame(tick);
    return () => {
      cancelAnimationFrame(stateRef.current.raf);
      ro.disconnect();
    };
  }, [inView, direction, speed]);

  const onPointerDown = (e) => {
    const scroller = scrollerRef.current;
    if (!scroller) return;
    stateRef.current.dragging = true;
    stateRef.current.startX = e.clientX;
    stateRef.current.startScroll = scroller.scrollLeft;
    stateRef.current.lastInteract = performance.now();
    setIsDragging(true);
    try {e.currentTarget.setPointerCapture(e.pointerId);} catch (_) {}
  };
  const onPointerMove = (e) => {
    if (!stateRef.current.dragging) return;
    const dx = e.clientX - stateRef.current.startX;
    scrollerRef.current.scrollLeft = stateRef.current.startScroll - dx;
    stateRef.current.lastInteract = performance.now();
  };
  const endDrag = (e) => {
    if (!stateRef.current.dragging) return;
    stateRef.current.dragging = false;
    stateRef.current.lastInteract = performance.now();
    setIsDragging(false);
    try {e && e.currentTarget?.releasePointerCapture?.(e.pointerId);} catch (_) {}
  };
  const onWheel = () => {stateRef.current.lastInteract = performance.now();};

  // Duplicate items for seamless loop
  const loop = [...items, ...items];

  return (
    <div
      style={{
        overflow: 'hidden',
        position: 'relative',
        WebkitMaskImage: 'linear-gradient(to right,transparent 0%,black 6%,black 94%,transparent 100%)',
        maskImage: 'linear-gradient(to right,transparent 0%,black 6%,black 94%,transparent 100%)',
        opacity: inView ? 1 : 0,
        transition: 'opacity 0.8s ease'
      }}>
      
      <div
        ref={scrollerRef}
        onPointerDown={onPointerDown}
        onPointerMove={onPointerMove}
        onPointerUp={endDrag}
        onPointerCancel={endDrag}
        onPointerLeave={(e) => {if (stateRef.current.dragging) endDrag(e);}}
        onWheel={onWheel}
        onMouseEnter={() => {stateRef.current.lastInteract = performance.now();}}
        onMouseMove={() => {stateRef.current.lastInteract = performance.now();}}
        style={{
          overflowX: 'auto',
          overflowY: 'hidden',
          cursor: isDragging ? 'grabbing' : 'grab',
          scrollbarWidth: 'none',
          msOverflowStyle: 'none',
          userSelect: 'none',
          WebkitUserSelect: 'none',
          touchAction: 'pan-y'
        }}>
        
        <style>{`#${idName}::-webkit-scrollbar{display:none}`}</style>
        <div id={idName} ref={trackRef} style={{ display: 'flex', gap, width: 'max-content', pointerEvents: isDragging ? 'none' : 'auto' }}>
          {loop.map((it, i) => renderItem(it, i))}
        </div>
      </div>
    </div>);

}

function shuffleSeeded(arr, seed) {
  // Fisher-Yates with a simple seeded PRNG (mulberry32) so order is stable per visit
  let a = 0x6d2b79f5 ^ seed;
  const rand = () => {
    a |= 0;a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
  const out = arr.slice();
  for (let i = out.length - 1; i > 0; i--) {
    const j = Math.floor(rand() * (i + 1));
    [out[i], out[j]] = [out[j], out[i]];
  }
  return out;
}

// ─── CLIENTS SECTION (drag marquee, two shuffled rows) ─────────
function ClientsSection({ clients }) {
  const [ref, inView] = useInView();
  // Randomize on every mount — different seed each visit
  const seedA = React.useMemo(() => Math.floor(Math.random() * 1e9), []);
  const seedB = React.useMemo(() => Math.floor(Math.random() * 1e9), []);
  const rowA = React.useMemo(() => shuffleSeeded(clients, seedA), [clients, seedA]);
  const rowB = React.useMemo(() => {
    let s = shuffleSeeded(clients, seedB);
    // Rotate so first items never line up vertically with rowA
    const off = Math.floor(s.length / 2) + (seedB % 3);
    return s.slice(off).concat(s.slice(0, off));
  }, [clients, seedB]);
  return (
    <section id="clients" data-screen-label="02 Clients" ref={ref} style={{ padding: '6rem 0', position: 'relative', overflow: 'hidden', background: 'rgba(255,255,255,0.012)', borderBottom: '1px solid var(--border)' }}>

// ─── PRESS F TO RESPAWN (email CTA with F-key trigger) ─────────
function PressFEmail({ email }) {
  const [pressed, setPressed] = useState(false);
  const [hov, setHov] = useState(false);
  const fireEmail = () => {
    setPressed(true);
    window.location.href = `mailto:${email}`;
    setTimeout(() => setPressed(false), 500);
  };
  useEffect(() => {
    const onKey = (e) => {
      if ((e.key === 'f' || e.key === 'F') && !e.metaKey && !e.ctrlKey && !e.altKey) {
        const tag = (e.target?.tagName || '').toLowerCase();
        if (tag === 'input' || tag === 'textarea' || e.target?.isContentEditable) return;
        e.preventDefault();
        fireEmail();
      }
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, []);
  const keyStyle = {
    display: 'inline-flex', alignItems: 'center', justifyContent: 'center',
    width: '1.15em', height: '1.15em',
    fontFamily: 'var(--font-condensed)', fontWeight: 900,
    background: pressed || hov ? 'var(--teal)' : 'var(--surface)',
    color: pressed || hov ? 'var(--black)' : 'var(--white)',
    border: '2px solid var(--teal)',
    borderRadius: 6,
    boxShadow: pressed
      ? 'inset 0 2px 4px rgba(0,0,0,0.4), 0 0 0 rgba(22,196,186,0)'
      : `0 ${hov ? 2 : 4}px 0 rgba(22,196,186,0.35), 0 ${hov ? 4 : 8}px 20px rgba(22,196,186,0.25)`,
    transform: pressed ? 'translateY(3px)' : 'translateY(0)',
    transition: 'all 0.08s ease',
    verticalAlign: '-0.18em',
    margin: '0 0.08em',
    lineHeight: 1,
    padding: '0.05em 0'
  };
  return (
    <div>
      <button
        onClick={fireEmail}
        onMouseEnter={() => setHov(true)}
        onMouseLeave={() => setHov(false)}
        aria-label={`Email us at ${email}`}
        style={{
          all: 'unset', cursor: 'pointer', display: 'inline-block',
          fontFamily: 'var(--font-condensed)', fontWeight: 900,
          fontSize: 'clamp(1.25rem,3vw,2rem)',
          color: 'var(--white)', textTransform: 'uppercase',
          letterSpacing: '0.01em', lineHeight: 1.25,
          borderBottom: '2px solid var(--teal)',
          paddingBottom: '0.25rem'
        }}>
        Press <span style={keyStyle}>F</span> to Respawn
      </button>
      <div style={{ marginTop: 10, fontFamily: 'var(--font-body)', fontSize: '12px', color: 'rgba(255,255,255,0.4)', letterSpacing: '0.04em' }}>
        <span style={{ color: 'var(--teal)' }}>↳</span> tap the key or hit <kbd style={{ fontFamily: 'var(--font-condensed)', fontWeight: 700, fontSize: '11px', padding: '1px 6px', background: 'var(--surface)', border: '1px solid var(--border-strong)', borderRadius: 3, color: 'rgba(255,255,255,0.7)' }}>F</kbd> on your keyboard — opens <span style={{ color: 'rgba(255,255,255,0.7)' }}>{email}</span>
      </div>
    </div>
  );
}

  const panelS = { position: 'fixed', bottom: '1.5rem', right: '1.5rem', zIndex: 600, background: 'rgba(17,17,17,0.98)', backdropFilter: 'blur(20px)', border: '1px solid var(--teal-border)', borderTop: '2px solid var(--teal)', width: 360, maxHeight: '82vh', overflow: 'hidden', display: 'flex', flexDirection: 'column', boxShadow: '0 20px 60px rgba(0,0,0,0.8)' };
  const tabS = (t) => ({ flex: 1, padding: '0.5rem 0.25rem', fontFamily: 'var(--font-condensed)', fontWeight: 700, fontSize: '10.5px', letterSpacing: '0.1em', textTransform: 'uppercase', cursor: 'pointer', background: tab === t ? 'var(--teal)' : 'transparent', color: tab === t ? 'var(--black)' : 'rgba(255,255,255,0.35)', border: 'none', transition: 'all 0.2s' });
  const lS = { fontFamily: 'var(--font-condensed)', fontWeight: 700, fontSize: '10px', letterSpacing: '0.15em', textTransform: 'uppercase', color: 'var(--teal)', display: 'block', marginBottom: 4 };
  const iS = { width: '100%', background: 'rgba(255,255,255,0.04)', border: '1px solid rgba(255,255,255,0.08)', padding: '0.45rem 0.7rem', color: 'var(--white)', fontFamily: 'var(--font-body)', fontSize: '13px', outline: 'none', marginBottom: 8, boxSizing: 'border-box' };
  const primBtn = { width: '100%', background: 'var(--teal)', color: 'var(--black)', border: 'none', padding: '0.6rem', fontFamily: 'var(--font-condensed)', fontWeight: 900, fontSize: '12px', letterSpacing: '0.14em', textTransform: 'uppercase', cursor: 'pointer' };

  const editingFounder = founders.find((f) => f.id === editingFounderId);

  return (
    <div style={panelS}>
      <div style={{ padding: '0.8rem 1.25rem', borderBottom: '1px solid rgba(255,255,255,0.06)', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
        <span style={{ fontFamily: 'var(--font-display)', fontSize: '1.1rem', color: 'var(--teal)', letterSpacing: '0.04em' }}>TWEAKS</span>
        <Eyebrow style={{ fontSize: '9px', color: 'rgba(22,196,186,0.7)' }}>● Auto-saved</Eyebrow>
      </div>
      <div style={{ display: 'flex', borderBottom: '1px solid rgba(255,255,255,0.06)' }}>
        {['brand', 'clients', 'work', 'team'].map((t) => <button key={t} style={tabS(t)} onClick={() => {setTab(t);setEditingWorkId(null);setEditingFounderId(null);}}>{t}</button>)}
      </div>
      <div style={{ overflowY: 'auto', padding: '1.25rem', flex: 1 }}>

        {tab === 'brand' &&
        <div>
            <label style={lS}>Teal Color</label>
            <div style={{ display: 'flex', gap: 8, alignItems: 'center', marginBottom: 10 }}>
              <input type="color" value={tweaks.teal} onChange={(e) => update('teal', e.target.value)} style={{ width: 36, height: 30, border: 'none', background: 'none', cursor: 'pointer', padding: 0 }} />
              <input type="text" value={tweaks.teal} onChange={(e) => update('teal', e.target.value)} style={{ ...iS, marginBottom: 0, flex: 1 }} />
            </div>
            {[['tagline', 'Hero Tagline'], ['aboutText', 'About Text'], ['email', 'Email'], ['phone1', 'Phone 1'], ['phone2', 'Phone 2']].map(([k, l]) =>
          <div key={k}><label style={lS}>{l}</label><textarea value={tweaks[k]} onChange={(e) => update(k, e.target.value)} rows={k === 'aboutText' ? 4 : 1} style={{ ...iS, resize: 'vertical' }} /></div>
          )}
          </div>
        }

        {tab === 'clients' &&
        <div>
            <div style={{ fontFamily: 'var(--font-body)', fontWeight: 300, fontSize: '12px', color: 'rgba(255,255,255,0.3)', marginBottom: '0.25rem' }}>{clients.length} clients</div>
            <div style={{ fontFamily: 'var(--font-body)', fontWeight: 300, fontSize: '10.5px', color: 'rgba(22,196,186,0.55)', marginBottom: '1rem', fontStyle: 'italic' }}>Changes save to this browser automatically.</div>
            {clients.map((c) =>
          <div key={c.id} style={{ padding: '0.55rem 0', borderBottom: '1px solid rgba(255,255,255,0.04)' }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: 8, minWidth: 0 }}>
                  <div style={{ display: 'flex', alignItems: 'center', gap: 8, minWidth: 0, flex: 1 }}>
                    {c.logo && <img src={c.logo} style={{ width: 24, height: 24, objectFit: 'contain', filter: 'brightness(0.9)', flexShrink: 0 }} onError={(e) => e.target.style.display = 'none'} />}
                    <span style={{ fontFamily: 'var(--font-condensed)', fontWeight: 600, fontSize: '13px', color: 'rgba(255,255,255,0.6)', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{c.name}</span>
                  </div>
                  <button onClick={() => setClients((cs) => cs.filter((x) => x.id !== c.id))} style={{ background: 'transparent', border: 'none', color: 'rgba(255,255,255,0.2)', cursor: 'pointer', fontSize: '0.9rem', flexShrink: 0 }} onMouseEnter={(e) => e.target.style.color = '#ff4444'} onMouseLeave={(e) => e.target.style.color = 'rgba(255,255,255,0.2)'}>✕</button>
                </div>
                <input type="text" value={c.industry || ''} onChange={(e) => setClients((cs) => cs.map((x) => x.id === c.id ? { ...x, industry: e.target.value } : x))} placeholder="Industry (e.g. Restaurant · Café)" style={{ ...iS, marginTop: 6, marginBottom: 0, fontSize: '11px', padding: '0.3rem 0.55rem' }} />
              </div>

            <div style={{ marginTop: '1.25rem', paddingTop: '1.25rem', borderTop: '1px solid rgba(255,255,255,0.06)' }}>
              <Eyebrow style={{ display: 'block', marginBottom: '0.75rem', fontSize: '10px' }}>Add New Client</Eyebrow>
              <label style={lS}>Brand Name</label>
              <input type="text" value={nc.name} onChange={(e) => setNc((n) => ({ ...n, name: e.target.value }))} style={iS} />
              <label style={lS}>Industry <span style={{ color: 'rgba(255,255,255,0.3)', fontWeight: 400 }}>(e.g. Restaurant · Café)</span></label>
              <input type="text" value={nc.industry} onChange={(e) => setNc((n) => ({ ...n, industry: e.target.value }))} style={iS} placeholder="Industry / category" />
              <label style={lS}>Brand Logo</label>
              <ImageUploader value={nc.logo} onChange={(url) => setNc((n) => ({ ...n, logo: url }))} label="Upload Logo (JPG / PNG)" />
              <label style={lS}>Instagram / Website URL <span style={{ color: 'rgba(255,255,255,0.3)', fontWeight: 400 }}>(optional)</span></label>
              <input type="text" value={nc.url} onChange={(e) => setNc((n) => ({ ...n, url: e.target.value }))} style={iS} placeholder="https://..." />
              <button onClick={() => {if (nc.name) {setClients((cs) => [...cs, { ...nc, url: nc.url || '#', id: Date.now() }]);setNc({ name: '', industry: '', logo: '', url: '' });}}} style={primBtn}>Add Client</button>
            </div>
          </div>
        }

        {tab === 'work' && !editingWork &&
        <div>
            <div style={{ fontFamily: 'var(--font-body)', fontWeight: 300, fontSize: '12px', color: 'rgba(255,255,255,0.3)', marginBottom: '1rem' }}>{workItems.length} campaigns · tap edit to add photos & videos</div>
            {workItems.map((w) =>
          <div key={w.id} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '0.5rem 0', borderBottom: '1px solid rgba(255,255,255,0.04)', gap: 8 }}>
                <div style={{ minWidth: 0, flex: 1 }}>
                  <div style={{ fontFamily: 'var(--font-condensed)', fontWeight: 700, fontSize: '13px', textTransform: 'lowercase', color: 'rgba(255,255,255,0.75)', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{w.headline?.replace(/\n/g, ' ')}</div>
                  <Eyebrow style={{ marginTop: 2 }}>{w.client} · {Array.isArray(w.media) ? w.media.length : 0} media</Eyebrow>
                </div>
                <button onClick={() => setEditingWorkId(w.id)} style={{ background: 'transparent', border: '1px solid var(--teal-border)', color: 'var(--teal)', padding: '3px 8px', fontFamily: 'var(--font-condensed)', fontWeight: 700, fontSize: '10px', letterSpacing: '0.1em', textTransform: 'uppercase', cursor: 'pointer' }}>Edit</button>
                <button onClick={() => setWorkItems((ws) => ws.filter((x) => x.id !== w.id))} style={{ background: 'transparent', border: 'none', color: 'rgba(255,255,255,0.2)', cursor: 'pointer', fontSize: '0.9rem' }} onMouseEnter={(e) => e.target.style.color = '#ff4444'} onMouseLeave={(e) => e.target.style.color = 'rgba(255,255,255,0.2)'}>✕</button>
              </div>
          )}
            <div style={{ marginTop: '1.25rem', paddingTop: '1.25rem', borderTop: '1px solid rgba(255,255,255,0.06)' }}>
              <Eyebrow style={{ display: 'block', marginBottom: '0.75rem', fontSize: '10px' }}>Add New Campaign</Eyebrow>
              <label style={lS}>Title <span style={{ color: 'rgba(255,255,255,0.3)', fontWeight: 400 }}>(use line break for wrap)</span></label>
              <input type="text" value={nw.headline} onChange={(e) => setNw((n) => ({ ...n, headline: e.target.value }))} style={iS} placeholder="e.g. social content" />
              <label style={lS}>Client Name</label>
              <input type="text" value={nw.client} onChange={(e) => setNw((n) => ({ ...n, client: e.target.value }))} style={iS} />
              <label style={lS}>Service Type / Tag</label>
              <input type="text" value={nw.tag} onChange={(e) => setNw((n) => ({ ...n, tag: e.target.value }))} style={iS} placeholder="Social Media, Campaign, Content..." />
              <label style={lS}>Cover Image</label>
              <ImageUploader value={nw.img} onChange={(url) => setNw((n) => ({ ...n, img: url }))} label="Upload Cover (JPG / PNG)" />
              <button onClick={() => {if (nw.img && nw.headline) {const id = Date.now();setWorkItems((ws) => [...ws, { ...nw, id }]);setNw({ img: '', headline: '', client: '', tag: '', description: '', media: [] });setEditingWorkId(id);}}} style={primBtn}>Add + Edit Media</button>
            </div>
          </div>
        }

        {tab === 'work' && editingWork &&
        <WorkEditor work={editingWork} setWorkItems={setWorkItems} onBack={() => setEditingWorkId(null)} lS={lS} iS={iS} primBtn={primBtn} />
        }

        {tab === 'team' && !editingFounder &&
        <div>
            <div style={{ fontFamily: 'var(--font-body)', fontWeight: 300, fontSize: '12px', color: 'rgba(255,255,255,0.3)', marginBottom: '1rem' }}>{founders.length} founders · tap edit to replace photo</div>
            {founders.map((f) =>
          <div key={f.id} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '0.5rem 0', borderBottom: '1px solid rgba(255,255,255,0.04)', gap: 8 }}>
                <div style={{ display: 'flex', alignItems: 'center', gap: 10, minWidth: 0, flex: 1 }}>
                  <img src={f.img} alt="" style={{ width: 36, height: 36, objectFit: 'cover', background: 'var(--surface)', flexShrink: 0 }} onError={(e) => e.target.style.opacity = '0.2'} />
                  <div style={{ minWidth: 0 }}>
                    <div style={{ fontFamily: 'var(--font-condensed)', fontWeight: 700, fontSize: '13px', color: 'rgba(255,255,255,0.75)', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{f.name}</div>
                    <Eyebrow style={{ fontSize: '9px' }}>{f.role}</Eyebrow>
                  </div>
                </div>
                <button onClick={() => setEditingFounderId(f.id)} style={{ background: 'transparent', border: '1px solid var(--teal-border)', color: 'var(--teal)', padding: '3px 8px', fontFamily: 'var(--font-condensed)', fontWeight: 700, fontSize: '10px', letterSpacing: '0.1em', textTransform: 'uppercase', cursor: 'pointer' }}>Edit</button>
              </div>
          )}
          </div>
        }

        {tab === 'team' && editingFounder &&
        <FounderEditor founder={editingFounder} setFounders={setFounders} onBack={() => setEditingFounderId(null)} lS={lS} iS={iS} primBtn={primBtn} />
        }

      </div>
    </div>);

}

// ─── WORK EDITOR (description + media upload) ──────────────────
function WorkEditor({ work, setWorkItems, onBack, lS, iS, primBtn }) {
  const inputRef = useRef(null);
  const patch = (patch) => setWorkItems((ws) => ws.map((x) => x.id === work.id ? { ...x, ...patch } : x));
  const addMedia = async (files) => {
    const news = [];
    for (const f of Array.from(files)) {
      const url = await fileToDataURL(f);
      const type = f.type.startsWith('video/') ? 'video' : 'image';
      news.push({ url, type, name: f.name });
    }
    patch({ media: [...(work.media || []), ...news] });
  };
  const removeMedia = (i) => patch({ media: (work.media || []).filter((_, idx) => idx !== i) });

  return (
    <div>
      <button onClick={onBack} style={{ background: 'transparent', border: 'none', color: 'var(--teal)', fontFamily: 'var(--font-condensed)', fontWeight: 700, fontSize: '11px', letterSpacing: '0.12em', textTransform: 'uppercase', cursor: 'pointer', padding: 0, marginBottom: 10, display: 'flex', alignItems: 'center', gap: 6 }}>← Back to campaigns</button>
      <div style={{ fontFamily: 'var(--font-display)', fontSize: '1.2rem', color: 'var(--white)', textTransform: 'lowercase', marginBottom: 10 }}>{work.headline?.replace(/\n/g, ' ')}</div>

      <label style={lS}>Title</label>
      <input type="text" value={work.headline || ''} onChange={(e) => patch({ headline: e.target.value })} style={iS} />
      <label style={lS}>Client</label>
      <input type="text" value={work.client || ''} onChange={(e) => patch({ client: e.target.value })} style={iS} />
      <label style={lS}>Tag</label>
      <input type="text" value={work.tag || ''} onChange={(e) => patch({ tag: e.target.value })} style={iS} />

      <label style={lS}>Cover Image</label>
      <ImageUploader value={work.img} onChange={(url) => patch({ img: url })} label="Upload Cover" />

      <label style={lS}>Campaign Description</label>
      <textarea value={work.description || ''} onChange={(e) => patch({ description: e.target.value })} rows={5} style={{ ...iS, resize: 'vertical' }} placeholder="Write a short paragraph about this campaign..." />

      <div style={{ marginTop: 8, paddingTop: 12, borderTop: '1px solid rgba(255,255,255,0.06)' }}>
        <label style={lS}>Photos & Videos <span style={{ color: 'rgba(255,255,255,0.35)', fontWeight: 400 }}>({(work.media || []).length})</span></label>
        <button type="button" onClick={() => inputRef.current?.click()} style={{ width: '100%', background: 'transparent', color: 'var(--teal)', border: '1px dashed var(--teal-border)', padding: '0.7rem', fontFamily: 'var(--font-condensed)', fontWeight: 800, fontSize: '11px', letterSpacing: '0.14em', textTransform: 'uppercase', cursor: 'pointer', marginBottom: 10 }}>+ Upload Photos / Videos</button>
        <input ref={inputRef} type="file" accept="image/*,video/*" multiple onChange={(e) => {addMedia(e.target.files);e.target.value = '';}} style={{ display: 'none' }} />

        {(work.media || []).length > 0 &&
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 6, marginBottom: 12 }}>
            {(work.media || []).map((m, i) =>
          <div key={i} style={{ position: 'relative', aspectRatio: '1/1', background: 'var(--black)', border: '1px solid var(--border)', overflow: 'hidden' }}>
                {m.type === 'video' ?
            <video src={m.url} style={{ width: '100%', height: '100%', objectFit: 'cover' }} /> :

            <img src={m.url} alt="" style={{ width: '100%', height: '100%', objectFit: 'cover' }} />
            }
                {m.type === 'video' && <div style={{ position: 'absolute', bottom: 4, left: 4, padding: '1px 5px', background: 'var(--teal)', color: 'var(--black)', fontFamily: 'var(--font-condensed)', fontWeight: 800, fontSize: 9, letterSpacing: '0.1em', textTransform: 'uppercase' }}>Video</div>}
                <button onClick={() => removeMedia(i)} style={{ position: 'absolute', top: 3, right: 3, width: 20, height: 20, background: 'rgba(0,0,0,0.8)', border: 'none', color: 'white', cursor: 'pointer', fontSize: 10, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>✕</button>
              </div>
          )}
          </div>
        }
      </div>

      <button onClick={onBack} style={primBtn}>Done</button>
    </div>);

}

// ─── FOUNDER EDITOR ────────────────────────────────────────────
function FounderEditor({ founder, setFounders, onBack, lS, iS, primBtn }) {
  const patch = (p) => setFounders((fs) => fs.map((x) => x.id === founder.id ? { ...x, ...p } : x));
  return (
    <div>
      <button onClick={onBack} style={{ background: 'transparent', border: 'none', color: 'var(--teal)', fontFamily: 'var(--font-condensed)', fontWeight: 700, fontSize: '11px', letterSpacing: '0.12em', textTransform: 'uppercase', cursor: 'pointer', padding: 0, marginBottom: 10 }}>← Back to team</button>
      <div style={{ fontFamily: 'var(--font-display)', fontSize: '1.2rem', color: 'var(--white)', marginBottom: 10 }}>{founder.name}</div>
      <label style={lS}>Photo</label>
      <ImageUploader value={founder.img} onChange={(url) => patch({ img: url })} label="Upload Photo (JPG / PNG)" />
      <label style={lS}>Name</label>
      <input type="text" value={founder.name} onChange={(e) => patch({ name: e.target.value })} style={iS} />
      <label style={lS}>Role</label>
      <input type="text" value={founder.role} onChange={(e) => patch({ role: e.target.value })} style={iS} />
      <label style={lS}>Bio</label>
      <textarea value={founder.bio} onChange={(e) => patch({ bio: e.target.value })} rows={4} style={{ ...iS, resize: 'vertical' }} />
      <button onClick={onBack} style={primBtn}>Done</button>
    </div>);

}

function App() {
  const [tweaks, setTweaks] = useState(TWEAK_DEFAULTS);
  const [clients, setClients] = useState(() => {
    try {
      const raw = localStorage.getItem('respawn-clients-v2');
      if (raw) return JSON.parse(raw);
    } catch (_) {}
    return INIT_CLIENTS;
  });
  const [workItems, setWorkItems] = useState(() => {
    try {
      const raw = localStorage.getItem('respawn-work');
      if (raw) return JSON.parse(raw);
    } catch (_) {}
    return INIT_WORK;
  });
  const [founders, setFounders] = useState(() => {
    try {
      const raw = localStorage.getItem('respawn-founders');
      if (raw) return JSON.parse(raw);
    } catch (_) {}
    return INIT_FOUNDERS;
  });
  const [tweaksOpen, setTweaksOpen] = useState(false);
  const [activeSection, setActiveSection] = useState('hero');
  const [mode, setMode] = useState(() => localStorage.getItem('respawn-preview-mode') || 'desktop');

  // Persist content edits so added clients / work / founder changes survive reloads
  useEffect(() => { try { localStorage.setItem('respawn-clients-v2', JSON.stringify(clients)); } catch(_) {} }, [clients]);
  useEffect(() => { try { localStorage.setItem('respawn-work', JSON.stringify(workItems)); } catch(_) {} }, [workItems]);
  useEffect(() => { try { localStorage.setItem('respawn-founders', JSON.stringify(founders)); } catch(_) {} }, [founders]);
  useEffect(() => {localStorage.setItem('respawn-preview-mode', mode);}, [mode]);
  useEffect(() => {
    const h = (e) => {
      if (e.data?.type === '__activate_edit_mode') setTweaksOpen(true);
      if (e.data?.type === '__deactivate_edit_mode') setTweaksOpen(false);
    };
    window.addEventListener('message', h);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', h);
  }, []);
  useEffect(() => {
    document.documentElement.style.setProperty('--teal', tweaks.teal);
    document.documentElement.style.setProperty('--teal-dim', tweaks.teal + '1f');
    document.documentElement.style.setProperty('--teal-border', tweaks.teal + '4d');
  }, [tweaks.teal]);

  if (mode === 'mobile') {
    return (
      <>
        <style>{`body{background:#050505}
          .mobile-shell{display:flex;align-items:flex-start;justify-content:center;min-height:100vh;padding:60px 20px 80px;background:radial-gradient(ellipse at top,#0a0a0a 0%,#000 70%)}
          .mobile-frame{width:420px;max-width:100%;height:900px;background:var(--black);overflow-y:auto;overflow-x:hidden;border-radius:44px;border:12px solid #18181a;position:relative;box-shadow:0 40px 80px rgba(0,0,0,0.7),inset 0 0 0 2px rgba(255,255,255,0.04)}
          .mobile-frame::-webkit-scrollbar{display:none}
          .mobile-notch{position:sticky;top:0;left:0;right:0;width:100%;height:44px;background:var(--black);z-index:300;display:flex;align-items:flex-end;justify-content:space-between;padding:0 26px 6px;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;color:#fff}
          .mobile-notch::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:110px;height:26px;background:#0a0a0a;border-radius:0 0 16px 16px}
          .mobile-frame nav{position:absolute!important;top:44px!important}
          .mobile-frame #hero{padding-top:56px!important}
        `}</style>
        <DeviceToggle mode={mode} setMode={setMode} />
        <div className="mobile-shell">
          <div className="mobile-frame">
            <div className="mobile-notch">
              <span style={{ zIndex: 2 }}>9:41</span>
              <div style={{ display: 'flex', gap: 5, alignItems: 'center', zIndex: 2 }}>
                <svg width="17" height="11" viewBox="0 0 17 11" fill="white"><path d="M1 8.5h2v2H1zM5 6.5h2v4H5zM9 3.5h2v7H9zM13 .5h2v10h-2z" /></svg>
                <svg width="15" height="11" viewBox="0 0 15 11" fill="white"><path d="M7.5 2a8 8 0 015.5 2.2l-1.4 1.5A6 6 0 007.5 4a6 6 0 00-4.1 1.7L2 4.2A8 8 0 017.5 2zM7.5 6a4 4 0 012.8 1.2l-1.4 1.4a2 2 0 00-2.8 0L4.7 7.2A4 4 0 017.5 6zM7.5 9.5a1 1 0 110 2 1 1 0 010-2z" /></svg>
                <div style={{ width: 22, height: 10, border: '1px solid white', borderRadius: 2, padding: 1, position: 'relative' }}>
                  <div style={{ width: '85%', height: '100%', background: 'white', borderRadius: 1 }} />
                  <div style={{ position: 'absolute', right: -3, top: 2, bottom: 2, width: 2, background: 'white', borderRadius: 1 }} />
                </div>
              </div>
            </div>
            <Site tweaks={tweaks} clients={clients} setClients={setClients} workItems={workItems} setWorkItems={setWorkItems} founders={founders} setFounders={setFounders} openTweaks={() => setTweaksOpen(true)} activeSection={activeSection} setActiveSection={setActiveSection} />
          </div>
        </div>
        <TweaksPanel open={tweaksOpen} tweaks={tweaks} setTweaks={setTweaks} clients={clients} setClients={setClients} workItems={workItems} setWorkItems={setWorkItems} founders={founders} setFounders={setFounders} />
      </>);

  }

  return (
    <>
      <DeviceToggle mode={mode} setMode={setMode} />
      <Site tweaks={tweaks} clients={clients} setClients={setClients} workItems={workItems} setWorkItems={setWorkItems} founders={founders} setFounders={setFounders} openTweaks={() => setTweaksOpen(true)} activeSection={activeSection} setActiveSection={setActiveSection} />
      <TweaksPanel open={tweaksOpen} tweaks={tweaks} setTweaks={setTweaks} clients={clients} setClients={setClients} workItems={workItems} setWorkItems={setWorkItems} founders={founders} setFounders={setFounders} />
    </>);

}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
