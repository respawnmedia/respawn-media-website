function useInView(threshold = 0.1) {
  const ref = useRef(null);
  const [v, setV] = useState(false);
  useEffect(() => {
    const o = new IntersectionObserver(([e]) => {if (e.isIntersecting) setV(true);}, { threshold });
    if (ref.current) o.observe(ref.current);
    return () => o.disconnect();
  }, []);
  return [ref, v];
}

// ─── FILE → DataURL HELPER ─────────────────────────────────────
function fileToDataURL(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}

function Hero({ tagline, heroVideos }) {
  const [on, setOn] = useState(false);
  const videoRef = useRef(null);
  // Build a shuffled playlist of all provided videos. We start with a fresh
  // random order on each page load, play each video to the end, advance to
  // the next, and re-shuffle when we reach the end so the loop is endless.
  const shuffle = (arr) => {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  };
  const sources = (heroVideos || []).filter(Boolean);
  const [playlist, setPlaylist] = useState(() => shuffle(sources));
  const [idx, setIdx] = useState(0);
  // Re-seed the playlist if the configured URL list changes (e.g. via Tweaks).
  useEffect(() => {
    setPlaylist(shuffle((heroVideos || []).filter(Boolean)));
    setIdx(0);
  }, [(heroVideos || []).join('|')]);
  const heroVideo = playlist[idx] || '';
  const handleVideoEnd = () => {
    setIdx((i) => {
      const next = i + 1;
      if (next >= playlist.length) {
        // Reached end — re-shuffle and start over so we never stop playing.
        // Avoid replaying the same clip back-to-back when possible.
        let reshuffled = shuffle(playlist);
        if (playlist.length > 1 && reshuffled[0] === playlist[i]) {
          reshuffled = [reshuffled[1], reshuffled[0], ...reshuffled.slice(2)];
        }
        setPlaylist(reshuffled);
        return 0;
      }
      return next;
    });
  };
  useEffect(() => {setTimeout(() => setOn(true), 120);}, []);
  // Force playback on every video swap. On mobile (especially iOS Safari),
  // autoplay can be blocked unless we call .play() imperatively after each
  // src change. We also retry on tap/scroll so a stuck video catches up.
  useEffect(() => {
    const v = videoRef.current;
    if (!v) return;
    const tryPlay = () => {
      const p = v.play();
      if (p && typeof p.catch === 'function') p.catch(() => {});
    };
    tryPlay();
    const onVis = () => { if (!document.hidden) tryPlay(); };
    document.addEventListener('visibilitychange', onVis);
    const kick = () => tryPlay();
    window.addEventListener('touchstart', kick, { once: true, passive: true });
    window.addEventListener('scroll', kick, { once: true, passive: true });
    return () => {
      document.removeEventListener('visibilitychange', onVis);
      window.removeEventListener('touchstart', kick);
      window.removeEventListener('scroll', kick);
    };
  }, [idx, playlist]);
  const SlideIn = ({ delay, children }) =>
  <div style={{ overflow: 'hidden' }}>
      <div style={{ transform: on ? 'translateY(0)' : 'translateY(105%)', transition: `transform 1s cubic-bezier(0.16,1,0.3,1) ${delay}ms` }}>{children}</div>
    </div>;
  // Tight drop shadow on the text itself — no wide ambient halo (which read
  // as a rectangular dark box behind the hero copy on lighter video frames).
  const shadow = '0 2px 4px rgba(0,0,0,0.85), 0 1px 1px rgba(0,0,0,0.9)';

  return (
    <section id="hero" data-screen-label="01 Hero" style={{ minHeight: '100vh', display: 'flex', flexDirection: 'column', justifyContent: 'flex-end', padding: '0 3rem 4.5rem', position: 'relative', overflow: 'hidden', borderBottom: '1px solid var(--border)', background: '#000' }}>
      {/* Hero background video — rotates randomly through the list set in Tweaks → Brand */}
      {heroVideo &&
        <video
          ref={videoRef}
          key={heroVideo}
          src={heroVideo}
          autoPlay muted playsInline loop
          preload="auto"
          disablePictureInPicture
          controls={false}
          onEnded={handleVideoEnd}
          aria-hidden="true"
          tabIndex={-1}
          style={{ position: 'absolute', inset: 0, width: '100%', height: '100%', objectFit: 'cover', zIndex: 0, pointerEvents: 'none' }}
        />
      }
      <div style={{ position: 'absolute', bottom: 0, left: 0, right: 0, height: 3, background: 'var(--teal)', opacity: on ? 1 : 0, transition: 'opacity 1.2s ease 1.4s', zIndex: 2 }} />
      <div style={{ maxWidth: 1280, width: '100%', margin: '0 auto', position: 'relative', zIndex: 2 }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: '1rem', opacity: on ? 1 : 0, transition: 'opacity 0.5s ease 0.3s', textShadow: shadow }}>
          <div style={{ width: 8, height: 8, background: 'var(--teal)', borderRadius: '50%', boxShadow: '0 1px 6px rgba(0,0,0,0.9)' }} />
          <Eyebrow>Respawn Media — Creative Studio</Eyebrow>
        </div>
        <div style={{ marginBottom: '2.5rem' }}>
          <SlideIn delay={180}><h1 className="hero-h" style={{ fontFamily: 'var(--font-display)', fontSize: 'clamp(28px,8vw,80px)', lineHeight: 0.9, letterSpacing: '0.01em', color: 'var(--white)', textShadow: shadow }}>Hi, We're</h1></SlideIn>
          <SlideIn delay={320}>
            <h1 className="hero-h" style={{ fontFamily: 'var(--font-display)', fontSize: 'clamp(28px,8vw,80px)', lineHeight: 0.9, letterSpacing: '0.01em', textShadow: shadow }}>
              <span style={{ color: 'var(--white)' }}>Respawn </span>
              <span style={{ color: 'var(--teal)' }}>Media.</span>
            </h1>
          </SlideIn>
        </div>
        <div style={{ height: 1, background: 'var(--border)', marginBottom: '1.5rem', opacity: on ? 1 : 0, transition: 'opacity 0.6s ease 0.9s' }} />
        <div className="hero-meta" style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-end', flexWrap: 'wrap', gap: '2rem', opacity: on ? 1 : 0, transition: 'opacity 0.7s ease 1s' }}>
          <p style={{ fontFamily: 'var(--font-body)', fontWeight: 300, fontSize: 'clamp(13px,1.4vw,17px)', maxWidth: 480, lineHeight: 1.7, color: "rgb(22, 196, 186)", textShadow: shadow }}>{tagline}</p>
          <div className="hero-meta-grid" style={{ display: 'flex', gap: '3rem', flexWrap: 'wrap' }}>
            {[['Agency', 'Respawn Media'], ['Location', 'Chennai, India']].map(([l, v]) =>
            <div key={l} style={{ textShadow: shadow }}>
                <div style={{ fontFamily: 'var(--font-body)', fontSize: '9.5px', letterSpacing: '0.2em', textTransform: 'uppercase', color: 'var(--gray)', marginBottom: '0.2rem' }}>{l}</div>
                <div style={{ fontFamily: 'var(--font-body)', fontWeight: 500, fontSize: '14px' }}>{v}</div>
              </div>
            )}
          </div>
        </div>
        <div className="hero-cta" style={{ display: 'flex', gap: '0.6rem', marginTop: '2rem', opacity: on ? 1 : 0, transition: 'opacity 0.7s ease 1.15s' }}>
          <a href="#clients" style={{ background: 'var(--white)', color: 'var(--black)', padding: '0.75rem 1.6rem', fontFamily: 'var(--font-condensed)', fontWeight: 800, fontSize: '13px', letterSpacing: '0.14em', textTransform: 'uppercase', transition: 'background 0.2s', boxShadow: '0 6px 20px rgba(0,0,0,0.55)' }} onMouseEnter={(e) => e.currentTarget.style.background = 'var(--teal)'} onMouseLeave={(e) => e.currentTarget.style.background = 'var(--white)'}>See Our Work</a>
          <a href="#contact" style={{ border: '1px solid var(--border-strong)', color: 'var(--white)', padding: '0.75rem 1.6rem', fontFamily: 'var(--font-condensed)', fontWeight: 700, fontSize: '13px', letterSpacing: '0.14em', textTransform: 'uppercase', transition: 'border-color 0.2s', textShadow: shadow, background: 'rgba(0,0,0,0.25)', backdropFilter: 'blur(2px)' }} onMouseEnter={(e) => e.currentTarget.style.borderColor = 'var(--teal)'} onMouseLeave={(e) => e.currentTarget.style.borderColor = 'var(--border-strong)'}>Start a Project</a>
        </div>
      </div>
    </section>);

}

// ─── DRAG-SCRUB MARQUEE ───────────────────────────────────────
// Continuously auto-scrolls. User can click-and-drag (or swipe) to scrub;
// releases back to auto after 1.5s of idle. Children are looped (2x)
// to create seamless wrap-around.
function DragMarquee({ items, renderItem, speed = 40, direction = 'left', inView, gap = 20, idName }) {
  const scrollerRef = useRef(null);
  const trackRef = useRef(null);
  const stateRef = useRef({ dragging: false, startX: 0, startScroll: 0, lastInteract: 0, halfWidth: 0, raf: null, initialized: false, moved: 0, suppressClick: false });
  const [isDragging, setIsDragging] = useState(false);
  // True while the user is actively interacting with this marquee (drag,
  // touch scroll, wheel). Used to broadcast a "hovered" state to children so
  // touch users see the same teal outline desktop hovers produce.
  const [interacting, setInteracting] = useState(false);
  const idleTimerRef = useRef(null);
  // Read inView/direction/speed from a ref inside the RAF so the loop never
  // tears down when those flip — earlier versions re-created the RAF on every
  // inView change, which raced with in-flight ticks and silently stalled the
  // auto-scroll. Keep one tick alive for the lifetime of the marquee.
  const liveRef = useRef({ inView, direction, speed });
  liveRef.current = { inView, direction, speed };

  const bumpInteract = () => {
    stateRef.current.lastInteract = performance.now();
    setInteracting(true);
    clearTimeout(idleTimerRef.current);
    idleTimerRef.current = setTimeout(() => setInteracting(false), 1500);
  };

  useEffect(() => {
    const scroller = scrollerRef.current;
    const track = trackRef.current;
    if (!scroller || !track) return;

    // Wait for layout, then measure half-track width (one copy of the items)
    const measure = () => {
      const hw = track.scrollWidth / 2;
      stateRef.current.halfWidth = hw;
      // For right-scrolling, we need to start from a mid position so we can scroll right (decrease scrollLeft)
      if (!stateRef.current.initialized && hw > 0) {
        scroller.scrollLeft = liveRef.current.direction === 'right' ? hw : 0;
        stateRef.current.position = scroller.scrollLeft;
        stateRef.current.initialized = true;
      }
    };
    measure();
    const ro = new ResizeObserver(measure);
    ro.observe(track);
    // Also remeasure once images settle — chip logos can change scrollWidth.
    const imgs = track.querySelectorAll('img');
    imgs.forEach((img) => {
      if (!img.complete) img.addEventListener('load', measure, { once: true });
    });

    let last = performance.now();
    let rafId = 0;
    const tick = (now) => {
      const s = stateRef.current;
      const live = liveRef.current;
      const dt = Math.min(64, now - last);
      last = now;
      const idle = now - s.lastInteract > 1500;
      if (!s.dragging && idle && live.inView && s.halfWidth > 0) {
        // Accumulate fractional offset in a ref — scrollLeft rounds to the
        // nearest integer in some browsers, so adding sub-pixel deltas would
        // otherwise be lost and the marquee would never advance.
        const dx = live.speed * dt / 1000 * (live.direction === 'right' ? -1 : 1);
        s.position = (s.position ?? scroller.scrollLeft) + dx;
        if (s.position >= s.halfWidth) s.position -= s.halfWidth;
        if (s.position < 0) s.position += s.halfWidth;
        scroller.scrollLeft = s.position;
      } else {
        // User is interacting: keep the position ref in sync with manual scroll.
        s.position = scroller.scrollLeft;
        if (s.halfWidth > 0) {
          if (s.position >= s.halfWidth) { s.position -= s.halfWidth; scroller.scrollLeft = s.position; }
          if (s.position < 0) { s.position += s.halfWidth; scroller.scrollLeft = s.position; }
        }
      }
      rafId = requestAnimationFrame(tick);
    };
    rafId = requestAnimationFrame(tick);
    return () => {
      cancelAnimationFrame(rafId);
      ro.disconnect();
    };
  }, []);

  const onPointerDown = (e) => {
    const scroller = scrollerRef.current;
    if (!scroller) return;
    // On touch devices, let native horizontal scroll (overflow-x:auto + touch-action:pan-x) handle the gesture
    // and let taps pass straight through to <a>/buttons. JS drag is desktop-only.
    if (e.pointerType === 'touch') {
      bumpInteract();
      return;
    }
    stateRef.current.dragging = true;
    stateRef.current.startX = e.clientX;
    stateRef.current.startScroll = scroller.scrollLeft;
    bumpInteract();
    stateRef.current.moved = 0;
    setIsDragging(true);
    try {e.currentTarget.setPointerCapture(e.pointerId);} catch (_) {}
  };
  const onPointerMove = (e) => {
    if (!stateRef.current.dragging) return;
    const dx = e.clientX - stateRef.current.startX;
    stateRef.current.moved = Math.max(stateRef.current.moved, Math.abs(dx));
    scrollerRef.current.scrollLeft = stateRef.current.startScroll - dx;
    bumpInteract();
  };
  const endDrag = (e) => {
    if (!stateRef.current.dragging) return;
    stateRef.current.dragging = false;
    bumpInteract();
    // Suppress next click if the user actually dragged (not just tapped)
    stateRef.current.suppressClick = stateRef.current.moved > 6;
    setIsDragging(false);
    try {e && e.currentTarget?.releasePointerCapture?.(e.pointerId);} catch (_) {}
  };
  const onClickCapture = (e) => {
    if (stateRef.current.suppressClick) {
      e.preventDefault();
      e.stopPropagation();
      stateRef.current.suppressClick = false;
    }
  };
  const onWheel = () => { bumpInteract(); };
  // No onScroll handler — our own RAF writes scroller.scrollLeft every frame,
  // which fires scroll events. If we bumped lastInteract on those, the idle
  // gate would never re-open and the marquee would self-stall. Pointer/touch/
  // wheel handlers below already catch every real user interaction.
  const onTouchStart = () => { bumpInteract(); };

  // Duplicate items for seamless loop
  const loop = [...items, ...items];

  return (
    <div
      style={{
        overflow: 'hidden',
        position: 'relative',
        WebkitMaskImage: 'linear-gradient(to right,transparent 0%,black 6%,black 94%,transparent 100%)',
        maskImage: 'linear-gradient(to right,transparent 0%,black 6%,black 94%,transparent 100%)',
        opacity: inView ? 1 : 0,
        transition: 'opacity 0.8s ease, box-shadow 0.35s ease',
        boxShadow: interacting ? 'inset 0 0 0 1px var(--teal-border), 0 0 0 1px var(--teal-border)' : 'none'
      }}>
      
      <div
        ref={scrollerRef}
        onPointerDown={onPointerDown}
        onPointerMove={onPointerMove}
        onPointerUp={endDrag}
        onPointerCancel={endDrag}
        onPointerLeave={(e) => {if (stateRef.current.dragging) endDrag(e);}}
        onClickCapture={onClickCapture}
        onWheel={onWheel}
        onTouchStart={onTouchStart}
        onTouchMove={onTouchStart}
        onMouseEnter={() => bumpInteract()}
        onMouseMove={() => bumpInteract()}
        style={{
          overflowX: 'auto',
          overflowY: 'hidden',
          cursor: isDragging ? 'grabbing' : 'grab',
          scrollbarWidth: 'none',
          msOverflowStyle: 'none',
          userSelect: 'none',
          WebkitUserSelect: 'none',
          touchAction: 'pan-x pan-y',
          WebkitOverflowScrolling: 'touch'
        }}>
        
        <style>{`#${idName}::-webkit-scrollbar{display:none}`}</style>
        <MarqueeActiveContext.Provider value={interacting}>
          <div id={idName} ref={trackRef} style={{ display: 'flex', gap, width: 'max-content', pointerEvents: isDragging ? 'none' : 'auto' }}>
            {loop.map((it, i) => renderItem(it, i))}
          </div>
        </MarqueeActiveContext.Provider>
      </div>
    </div>);

}

function shuffleSeeded(arr, seed) {
  // Fisher-Yates with a simple seeded PRNG (mulberry32) so order is stable per visit
  let a = 0x6d2b79f5 ^ seed;
  const rand = () => {
    a |= 0;a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
  const out = arr.slice();
  for (let i = out.length - 1; i > 0; i--) {
    const j = Math.floor(rand() * (i + 1));
    [out[i], out[j]] = [out[j], out[i]];
  }
  return out;
}

// ─── CLIENTS SECTION (drag marquee, two shuffled rows) ─────────
function ClientsSection({ clients }) {
  const [ref, inView] = useInView();
  // Randomize on every mount — different seed each visit
  const seedA = React.useMemo(() => Math.floor(Math.random() * 1e9), []);
  const seedB = React.useMemo(() => Math.floor(Math.random() * 1e9), []);
  const rowA = React.useMemo(() => shuffleSeeded(clients, seedA), [clients, seedA]);
  const rowB = React.useMemo(() => {
    let s = shuffleSeeded(clients, seedB);
    // Rotate so first items never line up vertically with rowA
    const off = Math.floor(s.length / 2) + seedB % 3;
    return s.slice(off).concat(s.slice(0, off));
  }, [clients, seedB]);
  return (
    <section id="clients" data-screen-label="02 Clients" ref={ref} style={{ padding: '6rem 0', position: 'relative', overflow: 'hidden', background: 'rgba(255,255,255,0.012)', borderBottom: '1px solid var(--border)' }}>

function WorkCard({ item, onOpen }) {
  const [hov, setHov] = useState(false);
  const tapRef = useRef({ x: 0, y: 0, t: 0, valid: false });
  const cardRef = useRef(null);
  useEffect(() => {
    const onUp = (e) => {
      const t = tapRef.current;
      if (!t.valid) return;
      tapRef.current.valid = false;
      const dx = Math.abs(e.clientX - t.x);
      const dy = Math.abs(e.clientY - t.y);
      const dt = performance.now() - t.t;
      if (dx < 8 && dy < 8 && dt < 600) {
        e.preventDefault();
        e.stopPropagation();
        onOpen();
      }
    };
    const onCancel = () => { tapRef.current.valid = false; };
    window.addEventListener('pointerup', onUp, true);
    window.addEventListener('pointercancel', onCancel, true);
    return () => {
      window.removeEventListener('pointerup', onUp, true);
      window.removeEventListener('pointercancel', onCancel, true);
    };
  }, [onOpen]);
  const handlePointerDown = (e) => {
    tapRef.current = { x: e.clientX, y: e.clientY, t: performance.now(), valid: true };
    // Don't let the marquee parent capture this pointer; we want our own click.
    e.stopPropagation();
  };
  return (
    <div
      ref={cardRef}
      onMouseEnter={() => setHov(true)}
      onMouseLeave={() => setHov(false)}
      onPointerDown={handlePointerDown}
      onClick={(e) => { e.preventDefault(); e.stopPropagation(); onOpen(); }}
    style={{ flexShrink: 0, width: 280, aspectRatio: '3/4', position: 'relative', overflow: 'hidden', cursor: 'pointer', background: 'var(--surface)' }}>
      <img src={item.img} alt={item.headline} style={{ width: '100%', height: '100%', objectFit: 'cover', transform: hov ? 'scale(1.06)' : 'scale(1)', filter: 'grayscale(15%)', transition: 'transform 0.7s cubic-bezier(0.16,1,0.3,1)' }} loading="lazy" />
      <div style={{ position: 'absolute', inset: 0, background: 'linear-gradient(to top,rgba(8,8,8,0.96) 0%,rgba(8,8,8,0.4) 50%,transparent 100%)', opacity: 0.75 }} />
      <div style={{ position: 'absolute', left: 0, right: 0, height: 3, background: 'var(--teal)', top: 0, transform: hov ? 'scaleX(1)' : 'scaleX(0)', transformOrigin: 'left', transition: 'transform 0.4s ease' }} />
      <div style={{ position: 'absolute', top: 12, right: 12, padding: '4px 8px', background: hov ? 'var(--teal)' : 'rgba(8,8,8,0.7)', color: hov ? 'var(--black)' : 'var(--teal)', border: '1px solid var(--teal-border)', fontFamily: 'var(--font-condensed)', fontWeight: 800, fontSize: '9.5px', letterSpacing: '0.14em', textTransform: 'uppercase', transition: 'all 0.2s' }}>View Case →</div>
      <div style={{ position: 'absolute', bottom: 0, left: 0, right: 0, padding: '1.25rem 1rem' }}>

      </div>
    </div>);

}

// Full-bleed media viewer that sits on top of CampaignModal. Supports
// keyboard arrows, click outside to close, and prev/next buttons.
function CampaignLightbox({ media, index, setIndex, onClose, isMobile, mobileOffset }) {
  useEffect(() => {
    const onKey = (e) => {
      if (e.key === 'Escape') { e.preventDefault(); onClose(e); }
      if (e.key === 'ArrowRight') setIndex((i) => (i + 1) % media.length);
      if (e.key === 'ArrowLeft') setIndex((i) => (i - 1 + media.length) % media.length);
    };
    document.addEventListener('keydown', onKey);
    return () => document.removeEventListener('keydown', onKey);
  }, [media.length, setIndex, onClose]);
  const m = media[index];
  const prev = (e) => { e.stopPropagation(); setIndex((i) => (i - 1 + media.length) % media.length); };
  const next = (e) => { e.stopPropagation(); setIndex((i) => (i + 1) % media.length); };
  return (
    <div onClick={onClose} style={{ position: isMobile ? 'absolute' : 'fixed', inset: isMobile ? 'auto' : 0, top: isMobile ? mobileOffset : 0, left: 0, right: 0, height: isMobile ? '100%' : undefined, width: isMobile ? '100%' : undefined, zIndex: 900, background: 'rgba(0,0,0,0.94)', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: isMobile ? 6 : 32, animation: 'fadeIn 0.2s ease' }}>
      <button onClick={onClose} aria-label="Close viewer" style={{ position: 'absolute', top: 14, right: 14, zIndex: 5, width: 40, height: 40, background: 'rgba(8,8,8,0.95)', border: '1px solid var(--teal-border)', color: 'var(--white)', fontSize: 18, cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center', backdropFilter: 'blur(6px)' }}>✕</button>
      {media.length > 1 && <>
        <button onClick={prev} aria-label="Previous" style={{ position: 'absolute', left: isMobile ? 6 : 18, top: '50%', transform: 'translateY(-50%)', zIndex: 5, width: 44, height: 44, background: 'rgba(8,8,8,0.85)', border: '1px solid var(--teal-border)', color: 'var(--white)', fontSize: 22, cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>‹</button>
        <button onClick={next} aria-label="Next" style={{ position: 'absolute', right: isMobile ? 6 : 18, top: '50%', transform: 'translateY(-50%)', zIndex: 5, width: 44, height: 44, background: 'rgba(8,8,8,0.85)', border: '1px solid var(--teal-border)', color: 'var(--white)', fontSize: 22, cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>›</button>
      </>}
      <div onClick={(e) => e.stopPropagation()} style={{ maxWidth: '100%', maxHeight: '100%', display: 'flex', alignItems: 'center', justifyContent: 'center', position: 'relative' }}>
        {m.type === 'video' ?
          <video key={m.url} src={m.url} controls autoPlay playsInline style={{ maxWidth: isMobile ? '94vw' : '90vw', maxHeight: isMobile ? '78vh' : '86vh', background: '#000', display: 'block' }} /> :
          <img key={m.url} src={m.url} alt="" style={{ maxWidth: isMobile ? '94vw' : '90vw', maxHeight: isMobile ? '78vh' : '86vh', objectFit: 'contain', display: 'block' }} />
        }

}

function PressFEmail({ email }) {
  const [pressed, setPressed] = useState(false);
  const [hov, setHov] = useState(false);
  const fireEmail = () => {
    setPressed(true);
    window.location.href = `mailto:${email}`;
    setTimeout(() => setPressed(false), 500);
  };
  useEffect(() => {
    const onKey = (e) => {
      if ((e.key === 'f' || e.key === 'F') && !e.metaKey && !e.ctrlKey && !e.altKey) {
        const tag = (e.target?.tagName || '').toLowerCase();
        if (tag === 'input' || tag === 'textarea' || e.target?.isContentEditable) return;
        e.preventDefault();
        fireEmail();
      }
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, []);
  const keyStyle = {
    display: 'flex', alignItems: 'center', justifyContent: 'center',
    width: '4.25rem', height: '4.25rem',
    fontFamily: 'var(--font-condensed)', fontWeight: 900,
    fontSize: '2.5rem',
    background: pressed || hov ? 'var(--teal)' : 'var(--surface)',
    color: pressed || hov ? 'var(--black)' : 'var(--white)',
    border: '2px solid var(--teal)',
    borderRadius: 10,
    boxShadow: pressed ?
    'inset 0 2px 6px rgba(0,0,0,0.45), 0 0 0 rgba(22,196,186,0)' :
    `0 ${hov ? 3 : 6}px 0 rgba(22,196,186,0.45), 0 ${hov ? 6 : 12}px 28px rgba(22,196,186,0.28)`,
    transform: pressed ? 'translateY(4px)' : 'translateY(0)',
    transition: 'all 0.1s ease',
    lineHeight: 1,
    cursor: 'pointer',
    padding: 0,
    userSelect: 'none'
  };
  return (
    <div>
      <div style={{ display: 'inline-flex', flexDirection: 'column', alignItems: 'center', gap: '1rem' }}>
        <button
          onClick={fireEmail}
          onMouseEnter={() => setHov(true)}
          onMouseLeave={() => setHov(false)}
          aria-label={`Email us at ${email}`}
          style={keyStyle}>
          F
        </button>
        <div style={{
          fontFamily: 'var(--font-condensed)', fontWeight: 900,
          fontSize: 'clamp(1.1rem,2.4vw,1.6rem)',
          color: 'var(--white)', textTransform: 'uppercase',
          letterSpacing: '0.06em', lineHeight: 1.1,
          textAlign: 'center'
        }}>
          Press F to Respawn
        </div>
      </div>
      <div style={{ marginTop: 14, fontFamily: 'var(--font-body)', fontSize: '12px', color: 'rgba(255,255,255,0.4)', letterSpacing: '0.04em' }}>
        <span style={{ color: 'var(--teal)' }}>↳</span> tap the key or hit <kbd style={{ fontFamily: 'var(--font-condensed)', fontWeight: 700, fontSize: '11px', padding: '1px 6px', background: 'var(--surface)', border: '1px solid var(--border-strong)', borderRadius: 3, color: 'rgba(255,255,255,0.7)' }}>F</kbd> on your keyboard — opens <span style={{ color: 'rgba(255,255,255,0.7)' }}>{email}</span>

    </div>);

function Site({ tweaks, clients, setClients, workItems, setWorkItems, founders, setFounders, openTweaks, activeSection, setActiveSection, scrollRoot }) {
  useEffect(() => {
    const sections = document.querySelectorAll('section[id]');
    const obs = new IntersectionObserver((entries) => {
      // Pick whichever observed section currently has the greatest intersection
      // ratio. This works the same whether the scrolling container is the
      // window (desktop) or the .mobile-frame element (mobile preview).
      let best = null;
      entries.forEach((e) => {
        if (e.isIntersecting && (!best || e.intersectionRatio > best.intersectionRatio)) best = e;
      });
      if (best) setActiveSection(best.target.id);
    }, { root: scrollRoot || null, threshold: [0.25, 0.4, 0.6] });
    sections.forEach((s) => obs.observe(s));
    return () => obs.disconnect();
  }, [scrollRoot]);
  return (
    <>
      {/* Active-section indicator — a soft teal inset border on whichever
          section is currently in view. Works on both desktop and mobile
          (the IO root above accounts for the mobile-frame scroll container). */}
      <style>{`
        section[id]{transition: box-shadow 0.45s cubic-bezier(0.16,1,0.3,1);}
        section[id="${activeSection}"]{box-shadow: inset 0 0 0 2px var(--teal-border), inset 0 0 60px rgba(22,196,186,0.06);}
      `}</style>
      <Nav active={activeSection} />
      <Hero tagline={tweaks.tagline} heroVideos={[tweaks.heroVideo1, tweaks.heroVideo2, tweaks.heroVideo3, tweaks.heroVideo4]} />
      <ClientsSection clients={clients} scrollRoot={scrollRoot} />
      <WorkSection workItems={workItems} scrollRoot={scrollRoot} />
      <WhoAreWeSection aboutText={tweaks.aboutText} founders={founders} />
      <ServicesSection />
      <ContactSection email={tweaks.email} phone1={tweaks.phone1} phone2={tweaks.phone2} />
      <Footer />
    </>);

}

function TweaksPanel({ open, tweaks, setTweaks, clients, setClients, workItems, setWorkItems, founders, setFounders, mode, setMode }) {

              </div>

            <div style={{ marginTop: '1.25rem', paddingTop: '1.25rem', borderTop: '1px solid rgba(255,255,255,0.06)' }}>
              <Eyebrow style={{ display: 'block', marginBottom: '0.75rem', fontSize: '10px' }}>Add New Client</Eyebrow>

        }

        {tab === 'clients' && editingClient &&

        {tab === 'work' && !editingWork &&

          <div key={w.id} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '0.5rem 0', borderBottom: '1px solid rgba(255,255,255,0.04)', gap: 8 }}>

                  <div style={{ fontFamily: 'var(--font-condensed)', fontWeight: 700, fontSize: '13px', textTransform: 'lowercase', color: 'rgba(255,255,255,0.75)', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{w.headline?.replace(/\n/g, ' ')}</div>
                  <Eyebrow style={{ marginTop: 2 }}>{w.client} · {Array.isArray(w.media) ? w.media.length : 0} media</Eyebrow>
                </div>
                <button onClick={() => setEditingWorkId(w.id)} style={{ background: 'transparent', border: '1px solid var(--teal-border)', color: 'var(--teal)', padding: '3px 8px', fontFamily: 'var(--font-condensed)', fontWeight: 700, fontSize: '10px', letterSpacing: '0.1em', textTransform: 'uppercase', cursor: 'pointer' }}>Edit</button>

}

// ─── WORK EDITOR (description + media upload) ──────────────────
function WorkEditor({ work, setWorkItems, onBack, lS, iS, primBtn }) {
  const inputRef = useRef(null);
  const patch = (patch) => setWorkItems((ws) => ws.map((x) => x.id === work.id ? { ...x, ...patch } : x));
  const addMedia = async (files) => {
    const news = [];
    for (const f of Array.from(files)) {
      const url = await fileToDataURL(f);
      const type = f.type.startsWith('video/') ? 'video' : 'image';
      news.push({ url, type, name: f.name });
    }
    patch({ media: [...(work.media || []), ...news] });
  };
  const removeMedia = (i) => patch({ media: (work.media || []).filter((_, idx) => idx !== i) });

  return (
    <div>
      <button onClick={onBack} style={{ background: 'transparent', border: 'none', color: 'var(--teal)', fontFamily: 'var(--font-condensed)', fontWeight: 700, fontSize: '11px', letterSpacing: '0.12em', textTransform: 'uppercase', cursor: 'pointer', padding: 0, marginBottom: 10, display: 'flex', alignItems: 'center', gap: 6 }}>← Back to campaigns</button>
      <div style={{ fontFamily: 'var(--font-display)', fontSize: '1.2rem', color: 'var(--white)', textTransform: 'lowercase', marginBottom: 10 }}>{work.headline?.replace(/\n/g, ' ')}</div>

      <label style={lS}>Title</label>
      <input type="text" value={work.headline || ''} onChange={(e) => patch({ headline: e.target.value })} style={iS} />
      <label style={lS}>Client</label>
      <input type="text" value={work.client || ''} onChange={(e) => patch({ client: e.target.value })} style={iS} />
      <label style={lS}>Tag</label>
      <input type="text" value={work.tag || ''} onChange={(e) => patch({ tag: e.target.value })} style={iS} />

      <label style={lS}>Cover Image</label>
      <ImageUploader value={work.img} onChange={(url) => patch({ img: url })} label="Upload Cover" />

      <label style={lS}>Campaign Description</label>
      <textarea value={work.description || ''} onChange={(e) => patch({ description: e.target.value })} rows={5} style={{ ...iS, resize: 'vertical' }} placeholder="Write a short paragraph about this campaign..." />

      <div style={{ marginTop: 8, paddingTop: 12, borderTop: '1px solid rgba(255,255,255,0.06)' }}>
        <label style={lS}>Photos & Videos <span style={{ color: 'rgba(255,255,255,0.35)', fontWeight: 400 }}>({(work.media || []).length})</span></label>
        <button type="button" onClick={() => inputRef.current?.click()} style={{ width: '100%', background: 'transparent', color: 'var(--teal)', border: '1px dashed var(--teal-border)', padding: '0.7rem', fontFamily: 'var(--font-condensed)', fontWeight: 800, fontSize: '11px', letterSpacing: '0.14em', textTransform: 'uppercase', cursor: 'pointer', marginBottom: 10 }}>+ Upload Photos / Videos</button>
        <input ref={inputRef} type="file" accept="image/*,video/*" multiple onChange={(e) => {addMedia(e.target.files);e.target.value = '';}} style={{ display: 'none' }} />

        {(work.media || []).length > 0 &&
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 6, marginBottom: 12 }}>
            {(work.media || []).map((m, i) =>
          <div key={i} style={{ position: 'relative', aspectRatio: '1/1', background: 'var(--black)', border: '1px solid var(--border)', overflow: 'hidden' }}>
                {m.type === 'video' ?
            <video src={m.url} style={{ width: '100%', height: '100%', objectFit: 'cover' }} /> :

            <img src={m.url} alt="" style={{ width: '100%', height: '100%', objectFit: 'cover' }} />
            }
                {m.type === 'video' && <div style={{ position: 'absolute', bottom: 4, left: 4, padding: '1px 5px', background: 'var(--teal)', color: 'var(--black)', fontFamily: 'var(--font-condensed)', fontWeight: 800, fontSize: 9, letterSpacing: '0.1em', textTransform: 'uppercase' }}>Video</div>}
                <button onClick={() => removeMedia(i)} style={{ position: 'absolute', top: 3, right: 3, width: 20, height: 20, background: 'rgba(0,0,0,0.8)', border: 'none', color: 'white', cursor: 'pointer', fontSize: 10, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>✕</button>
              </div>
          )}
          </div>
        }
      </div>

      <button onClick={onBack} style={primBtn}>Done</button>
    </div>);

}

// ─── FOUNDER EDITOR ────────────────────────────────────────────
function FounderEditor({ founder, setFounders, onBack, lS, iS, primBtn }) {
  const patch = (p) => setFounders((fs) => fs.map((x) => x.id === founder.id ? { ...x, ...p } : x));
  return (
    <div>
      <button onClick={onBack} style={{ background: 'transparent', border: 'none', color: 'var(--teal)', fontFamily: 'var(--font-condensed)', fontWeight: 700, fontSize: '11px', letterSpacing: '0.12em', textTransform: 'uppercase', cursor: 'pointer', padding: 0, marginBottom: 10 }}>← Back to team</button>
      <div style={{ fontFamily: 'var(--font-display)', fontSize: '1.2rem', color: 'var(--white)', marginBottom: 10 }}>{founder.name}</div>
      <label style={lS}>Photo</label>
      <ImageUploader value={founder.img} onChange={(url) => patch({ img: url })} label="Upload Photo (JPG / PNG)" />
      <label style={lS}>Name</label>
      <input type="text" value={founder.name} onChange={(e) => patch({ name: e.target.value })} style={iS} />
      <label style={lS}>Role</label>
      <input type="text" value={founder.role} onChange={(e) => patch({ role: e.target.value })} style={iS} />
      <label style={lS}>Bio</label>
      <textarea value={founder.bio} onChange={(e) => patch({ bio: e.target.value })} rows={4} style={{ ...iS, resize: 'vertical' }} />
      <button onClick={onBack} style={primBtn}>Done</button>
    </div>);

}

function App() {
  const [tweaks, setTweaks] = useState(TWEAK_DEFAULTS);
  // Clients & work are baked into the file so every visitor sees the same content.
  // Edit INIT_CLIENTS / INIT_WORK at the top of this file to add or change entries.
  const [clients, setClients] = useState(INIT_CLIENTS);
  const [workItems, setWorkItems] = useState(INIT_WORK);
  const [founders, setFounders] = useState(INIT_FOUNDERS);
  const [tweaksOpen, setTweaksOpen] = useState(false);
  const [activeSection, setActiveSection] = useState('hero');
  const [mode, setMode] = useState(() => localStorage.getItem('respawn-preview-mode') || 'desktop');
  const mobileFrameRef = useRef(null);
  const [mobileScrollRoot, setMobileScrollRoot] = useState(null);

  // Persist preview-mode choice across reloads.
  useEffect(() => { localStorage.setItem('respawn-preview-mode', mode); }, [mode]);
  useEffect(() => {
    if (mode === 'mobile') {
      // Wait a tick for the frame to mount, then expose it as the IO root.
      const id = setTimeout(() => setMobileScrollRoot(mobileFrameRef.current || null), 0);
      return () => clearTimeout(id);
    } else {
      setMobileScrollRoot(null);
    }
  }, [mode]);
  useEffect(() => {
    const h = (e) => {
      if (e.data?.type === '__activate_edit_mode') setTweaksOpen(true);
      if (e.data?.type === '__deactivate_edit_mode') setTweaksOpen(false);
    };
    window.addEventListener('message', h);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', h);
  }, []);
  useEffect(() => {
    document.documentElement.style.setProperty('--teal', tweaks.teal);
    document.documentElement.style.setProperty('--teal-dim', tweaks.teal + '1f');
    document.documentElement.style.setProperty('--teal-border', tweaks.teal + '4d');
  }, [tweaks.teal]);

  if (mode === 'mobile') {
    return (
      <>
        <style>{`body{background:#050505}
          .mobile-shell{display:flex;align-items:flex-start;justify-content:center;min-height:100vh;padding:60px 20px 80px;background:radial-gradient(ellipse at top,#0a0a0a 0%,#000 70%)}
          .mobile-frame{width:420px;max-width:100%;height:900px;background:var(--black);overflow-y:auto;overflow-x:hidden;border-radius:44px;border:12px solid #18181a;position:relative;box-shadow:0 40px 80px rgba(0,0,0,0.7),inset 0 0 0 2px rgba(255,255,255,0.04)}
          .mobile-frame::-webkit-scrollbar{display:none}
          .mobile-notch{position:sticky;top:0;left:0;right:0;width:100%;height:44px;background:var(--black);z-index:300;display:flex;align-items:flex-end;justify-content:space-between;padding:0 26px 6px;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;color:#fff}
          .mobile-notch::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:110px;height:26px;background:#0a0a0a;border-radius:0 0 16px 16px}
          .mobile-frame nav{position:absolute!important;top:44px!important}
          .mobile-frame #hero{padding-top:56px!important}
        `}</style>
        <div className="mobile-shell">
          <div className="mobile-frame" ref={mobileFrameRef}>
            <div className="mobile-notch">
              <span style={{ zIndex: 2 }}>9:41</span>
              <div style={{ display: 'flex', gap: 5, alignItems: 'center', zIndex: 2 }}>
                <svg width="17" height="11" viewBox="0 0 17 11" fill="white"><path d="M1 8.5h2v2H1zM5 6.5h2v4H5zM9 3.5h2v7H9zM13 .5h2v10h-2z" /></svg>
                <svg width="15" height="11" viewBox="0 0 15 11" fill="white"><path d="M7.5 2a8 8 0 015.5 2.2l-1.4 1.5A6 6 0 007.5 4a6 6 0 00-4.1 1.7L2 4.2A8 8 0 017.5 2zM7.5 6a4 4 0 012.8 1.2l-1.4 1.4a2 2 0 00-2.8 0L4.7 7.2A4 4 0 017.5 6zM7.5 9.5a1 1 0 110 2 1 1 0 010-2z" /></svg>
                <div style={{ width: 22, height: 10, border: '1px solid white', borderRadius: 2, padding: 1, position: 'relative' }}>
                  <div style={{ width: '85%', height: '100%', background: 'white', borderRadius: 1 }} />
                  <div style={{ position: 'absolute', right: -3, top: 2, bottom: 2, width: 2, background: 'white', borderRadius: 1 }} />
                </div>
              </div>
            </div>
            <Site tweaks={tweaks} clients={clients} setClients={setClients} workItems={workItems} setWorkItems={setWorkItems} founders={founders} setFounders={setFounders} openTweaks={() => setTweaksOpen(true)} activeSection={activeSection} setActiveSection={setActiveSection} scrollRoot={mobileScrollRoot} />
          </div>
        </div>
        <TweaksPanel open={tweaksOpen} tweaks={tweaks} setTweaks={setTweaks} clients={clients} setClients={setClients} workItems={workItems} setWorkItems={setWorkItems} founders={founders} setFounders={setFounders} mode={mode} setMode={setMode} />
      </>);

  }

  return (
    <>
      <Site tweaks={tweaks} clients={clients} setClients={setClients} workItems={workItems} setWorkItems={setWorkItems} founders={founders} setFounders={setFounders} openTweaks={() => setTweaksOpen(true)} activeSection={activeSection} setActiveSection={setActiveSection} />
      <TweaksPanel open={tweaksOpen} tweaks={tweaks} setTweaks={setTweaks} clients={clients} setClients={setClients} workItems={workItems} setWorkItems={setWorkItems} founders={founders} setFounders={setFounders} mode={mode} setMode={setMode} />
    </>);

}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>


</body></html>
